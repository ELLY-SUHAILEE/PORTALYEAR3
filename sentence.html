<!DOCTYPE html>
<html lang="en">

            border-radius: 28px;
            border: 4px solid #fed7aa;

            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;

            color: #052e16;
            padding: 10px 18px;

            border-radius: 14px;
            font-size: 18px !important;
            font-weight: 700;

            text-decoration: none;
            box-shadow: 0 4px 0px #16a34a;

            color: #065f46;
            margin: 0 0 5px 0;
            font-size: 30px;
            text-align: center;
            text-shadow: 2px 2px 0px #a7f3d0;
        }

        .sub-title {
            color: #047857;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 18px;
        }

            margin-bottom: 20px;
        }

            font-weight: 700;
            border: 3px solid #a7f3d0;
            border-radius: 16px;

            color: #047857;

            border-color: #047857;

        }

            border-radius: 14px;
            font-size: 18px !important;
            background: #ecfdf5;
            color: #064e3b;
            font-weight: 700;
            outline: none;

            padding: 20px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.05);

            color: #065f46;
            margin-top: 0;

            padding: 10px;

            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;

            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;

        .word-chip.verb    { background: #fbcfe8; border-color: #f472b6; box-shadow: 0 4px 0px #db2777; color: #831843; }

    // AUDIO SYNTHESIS FUNCTIONS (WEB AUDIO API)
    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playClickSound() {
        try {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } catch (e) {}
    }

    function playCorrectSound() {
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 jingle
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                gain.gain.setValueAtTime(0.25, now + idx * 0.09);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.09);
                osc.stop(now + idx * 0.09 + 0.3);
            });
        } catch (e) {}
    }

    function playWrongSound() {
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const notes = [260, 200];
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                gain.gain.setValueAtTime(0.15, now + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.22);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.22);
            });
        } catch (e) {}
    }

    // STAR REWARD BURST ANIMATION
    function triggerStarReward() {
        const starSymbols = ['⭐', '🌟', '✨', '🎉', '🏆'];
        const card = document.getElementById('main-card');
        const rect = card.getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        for (let i = 0; i < 28; i++) {
            const particle = document.createElement('div');
            particle.className = 'star-particle';
            particle.innerText = starSymbols[Math.floor(Math.random() * starSymbols.length)];
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';

            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 220;
            const tx = (Math.cos(angle) * dist) + 'px';
            const ty = (Math.sin(angle) * dist) + 'px';

            particle.style.setProperty('--tx', tx);
            particle.style.setProperty('--ty', ty);

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1200);
        }
    }

            mode2: [
                { prompt: "Giraffes are _____ than horses.", ans: "taller", options: ["taller", "tallest", "tall"] },
                { prompt: "Mount Everest is the _____ mountain in the world.", ans: "highest", options: ["highest", "higher", "high"] }
            ],
            mode3: [
                { prompt: "Build: Comparison Sentence", slots: [
                    { type: "subject", text: "Sharks" },
                    { type: "verb", text: "are scarier than" },
                    { type: "object", text: "dolphins." }
                ], options: [
                    { text: "Sharks", type: "subject" },
                    { text: "are scarier than", type: "verb" },
                    { text: "dolphins.", type: "object" }
                ]}
            ]
        }
    };

    function onModuleChange() {
        questionIndex = 0;
        loadCurrentQuiz();
    }

    function changeMode(mode) {
        currentMode = mode;
        questionIndex = 0;
        document.getElementById('m1-btn').classList.toggle('active-mode', mode === 1);
        document.getElementById('m2-btn').classList.toggle('active-mode', mode === 2);
        document.getElementById('m3-btn').classList.toggle('active-mode', mode === 3);
        loadCurrentQuiz();
    }

    function loadCurrentQuiz() {
        const modKey = document.getElementById('module-select').value;
        const modData = dataset[modKey] || dataset['m1'];
        
        let qList = [];
        if (currentMode === 1) qList = modData.mode1;
        else if (currentMode === 2) qList = modData.mode2;
        else qList = modData.mode3;

        if (!qList || qList.length === 0) {
            document.getElementById('prompt-text').innerText = "No questions available for this mode.";
            document.getElementById('drop-zone').innerHTML = '';
            document.getElementById('word-bank').innerHTML = '';
            return;
        }

        if (questionIndex >= qList.length) questionIndex = qList.length - 1;
        if (questionIndex < 0) questionIndex = 0;

        document.getElementById('q-counter').innerText = `Question ${questionIndex + 1} / ${qList.length}`;
        document.getElementById('feedback').style.display = 'none';

        const q = qList[questionIndex];
        const dropZone = document.getElementById('drop-zone');
        const wordBank = document.getElementById('word-bank');
        const promptText = document.getElementById('prompt-text');

        dropZone.innerHTML = '';
        wordBank.innerHTML = '';

        if (currentMode === 1) {
            promptText.innerText = "Arrange the words to form a correct sentence:";
            let shuffled = [...q.dist];
            shuffled.forEach((w, idx) => {
                wordBank.appendChild(createChip(w, `w_${idx}`));
            });
        } else if (currentMode === 2) {
            promptText.innerText = q.prompt;
            q.options.forEach((opt, idx) => {
                wordBank.appendChild(createChip(opt, `opt_${idx}`));
            });
        } else {
            promptText.innerText = q.prompt;
            q.options.forEach((optObj, idx) => {
                const chip = createChip(optObj.text, `s_${idx}`);
                if (optObj.type) {
                    chip.classList.add(optObj.type);
                }
                wordBank.appendChild(chip);
            });
        }
    }

    function createChip(text, id) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerText = text;
        chip.id = id;
        chip.draggable = true;

        chip.ondragstart = (e) => {
            e.dataTransfer.setData('text/plain', id);
        };

        chip.onclick = () => {
            playClickSound();
            const dropZone = document.getElementById('drop-zone');
            const wordBank = document.getElementById('word-bank');

            if (chip.parentElement === wordBank) {
                dropZone.appendChild(chip);
            } else {
                wordBank.appendChild(chip);
            }
        };

        return chip;
    }

    function allowDrop(e) {
        e.preventDefault();
    }

    function handleDrop(e) {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const draggedEl = document.getElementById(id);
        if (draggedEl) {
            playClickSound();
            e.currentTarget.appendChild(draggedEl);
        }
    }

    function checkAnswer() {
        const modKey = document.getElementById('module-select').value;
        const modData = dataset[modKey] || dataset['m1'];
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';

        const dropZone = document.getElementById('drop-zone');
        const userChips = Array.from(dropZone.children).map(c => c.innerText.trim());

        let isCorrect = false;

        if (currentMode === 1) {
            const target = modData.mode1[questionIndex].target.join(" ");
            const userAns = userChips.join(" ");
            isCorrect = (target === userAns);
        } else if (currentMode === 2) {
            const ans = modData.mode2[questionIndex].ans;
            isCorrect = (userChips.length === 1 && userChips[0] === ans);
        } else {
            const targetSlots = modData.mode3[questionIndex].slots.map(s => s.text).join(" ");
            const userAns = userChips.join(" ");
            isCorrect = (targetSlots === userAns);
        }

        if (isCorrect) {
            playCorrectSound();
            triggerStarReward();
            feedback.className = "feedback-card feedback-correct";
            feedback.innerText = "🎉 Excellent! That's correct!";
        } else {
            playWrongSound();
            feedback.className = "feedback-card feedback-wrong";
            feedback.innerText = "❌ Oops! Try again or reset.";
        }
    }

    function resetCurrentQuestion() {
        loadCurrentQuiz();
    }

    function nextQuestion() {
        const modKey = document.getElementById('module-select').value;
        const modData = dataset[modKey] || dataset['m1'];
        let maxLen = currentMode === 1 ? modData.mode1.length : (currentMode === 2 ? modData.mode2.length : modData.mode3.length);

        if (questionIndex < maxLen - 1) {
            questionIndex++;
            loadCurrentQuiz();
        } else {
            playCorrectSound();
            triggerStarReward();
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = "feedback-card feedback-correct";
            feedback.innerText = "🌟 Great job! You reached the end of this exercise!";
        }
    }

    function prevQuestion() {
        if (questionIndex > 0) {
            questionIndex--;
            loadCurrentQuiz();
        }
    }

    window.onload = function() {
        loadCurrentQuiz();
    };
</script>

</body>
</html>
