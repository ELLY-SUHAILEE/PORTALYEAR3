<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Forest English Quest 🌲</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Hijau Emerald Terang */
        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN & ELEMENT HUTAN */
        .forest-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .creature-bird {
            top: 6%;
            width: 220px;
            height: auto;
            animation: flyRight 22s infinite linear;
            opacity: 0.9;
        }

        .creature-owl {
            top: 10%;
            right: 4%;
            width: 130px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            opacity: 0.95;
        }

        .creature-butterfly1 {
            top: 38%;
            left: 3%;
            width: 100px;
            height: auto;
            animation: flutter 9s infinite ease-in-out;
        }

        .creature-butterfly2 {
            top: 52%;
            right: 4%;
            width: 90px;
            height: auto;
            animation: flutter 11s infinite ease-in-out;
            animation-delay: 2s;
        }

        @keyframes flyRight {
            0% { transform: translateX(-30vw) translateY(0px) scale(0.9); }
            50% { transform: translateX(45vw) translateY(-20px) scale(1.1); }
            100% { transform: translateX(115vw) translateY(10px) scale(0.9); }
        }

        @keyframes flutter {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(-8deg) scale(1.05); }
            75% { transform: translateY(15px) rotate(8deg) scale(0.95); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(-4deg); }
        }

        body::before, body::after {
            content: "🍃";
            position: fixed;
            font-size: 2rem;
            opacity: 0.4;
            animation: leafFall 10s infinite linear;
            z-index: 0;
        }
        body::before { left: 18%; animation-duration: 11s; }
        body::after { right: 25%; animation-duration: 8s; animation-delay: 3s; }

        @keyframes leafFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(80px); opacity: 0; }
        }

        /* Kad Utama Portal */
        .card {
            background: rgba(245, 253, 248, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa;
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #166534;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 34px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #fed7aa;
            letter-spacing: 0.5px;
        }

        .subtitle-portal {
            text-align: center;
            color: #15803d;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #166534;
            font-size: 20px !important;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #86efac;
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #f0fdf4;
            color: #052e16;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        input[type="text"]:focus {
            border-color: #fb923c;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(253, 186, 116, 0.4);
        }

        .sub-title {
            text-align: center;
            font-weight: 700;
            margin-top: 25px;
            margin-bottom: 20px;
            color: #c2410c;
            font-size: 22px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* SUSUNAN 5 BUTANG MODUL UTIMA */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .btn-set {
            padding: 18px 15px;
            border: none;
            border-radius: 20px;
            font-size: 20px !important;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.18);
            transition: all 0.15s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.18);
        }

        /* 1. GET SMART SET: Hijau Cair */
        .btn-blue {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 6px 0px #15803d;
        }
        .btn-blue:hover { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); }

        /* 2. REMEDIAL SET: Oren Cair */
        .btn-green {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            box-shadow: 0 6px 0px #c2410c;
        }
        .btn-green:hover { background: linear-gradient(135deg, #fdba74 0%, #fb923c 100%); }

        /* 3. READING CORNER: Ungu Ceria */
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            box-shadow: 0 6px 0px #7e22ce;
        }
        .btn-purple:hover { background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%); }

        /* 4. GRAMMAR FUN: Magenta / Pink */
        .btn-pink {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 6px 0px #be185d;
        }
        .btn-pink:hover { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }

        /* 5. SENTENCE BUILDER: Teal Segar */
        .btn-teal {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            box-shadow: 0 6px 0px #0f766e;
            grid-column: span 1;
        }
        .btn-teal:hover { background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%); }

        @media (min-width: 600px) {
            .btn-teal-wide {
                grid-column: span 2;
            }
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #166534;
            font-weight: 600;
            text-decoration: none;
            font-size: 18px;
        }

        .link-guru:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animasi Hiasan -->
    <div class="forest-decor creature-bird">🦅</div>
    <div class="forest-decor creature-owl">🦉</div>
    <div class="forest-decor creature-butterfly1">🦋</div>
    <div class="forest-decor creature-butterfly2">🦋</div>

    <!-- Kad Utama Portal -->
    <div class="card">
        <h1>🌲 Forest English Quest - Year 3</h1>
        <p class="subtitle-portal">Welcome Explorer! Enter your name and choose a learning quest below.</p>

        <!-- Borang Masukan Nama Murid -->
        <div class="form-group">
            <label for="studentName">👤 Enter Student Name:</label>
            <input type="text" id="studentName" placeholder="Type your full name here..." oninput="saveName()">
        </div>

        <div class="sub-title">🎮 SELECT LEARNING MODULE:</div>

        <!-- 5 Butang Utama Modul -->
        <div class="btn-grid">
            <a href="getsmart.html" onclick="checkName(event)" class="btn-set btn-blue">📘 GET SMART SET</a>
            <a href="remedial.html" onclick="checkName(event)" class="btn-set btn-green">📙 REMEDIAL SET</a>
            <a href="reading.html" onclick="checkName(event)" class="btn-set btn-purple">📚 READING CORNER</a>
            <a href="grammar.html" onclick="checkName(event)" class="btn-set btn-pink">✏️ GRAMMAR FUN</a>
            <a href="sentence.html" onclick="checkName(event)" class="btn-set btn-teal btn-teal-wide">🧩 SENTENCE BUILDER</a>
        </div>

        <a href="admin.html" class="link-guru">🔑 Teacher / Admin Access</a>
    </div>

    <script>
        // Simpan nama murid secara automatik
        function saveName() {
            const name = document.getElementById('studentName').value;
            localStorage.setItem('studentName', name);
        }

        // Muatkan nama jika pernah ditaip
        window.onload = function() {
            const savedName = localStorage.getItem('studentName');
            if (savedName) {
                document.getElementById('studentName').value = savedName;
            }
        };

        // Semak nama sebelum masuk modul
        function checkName(e) {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                e.preventDefault();
                alert('Sila taip nama anda terlebih dahulu sebelum memilih modul! / Please enter your name first!');
            }
        }
    </script>
</body>
</html>
