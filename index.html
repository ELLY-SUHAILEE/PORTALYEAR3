<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Forest English Quest 🌲</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Hijau Emerald Terang */
        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN & ELEMENT HUTAN / KABIN / GUNUNG */
        .forest-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .creature-bird {
            top: 6%;
            width: 220px;
            height: auto;
            animation: flyRight 22s infinite linear;
            opacity: 0.9;
        }

        .creature-owl {
            top: 10%;
            right: 4%;
            width: 130px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            opacity: 0.95;
        }

        .creature-butterfly1 {
            top: 38%;
            left: 3%;
            width: 100px;
            height: auto;
            animation: flutter 9s infinite ease-in-out;
        }

        .creature-butterfly2 {
            top: 52%;
            right: 4%;
            width: 90px;
            height: auto;
            animation: flutter 11s infinite ease-in-out;
            animation-delay: 2s;
        }

        /* Kabin & Gunung Hutan (Bahagian Bawah Kiri) */
        .creature-cabin {
            bottom: 10px;
            left: 2%;
            width: 220px;
            height: auto;
            animation: pulseGlow 5s infinite alternate;
        }

        /* Cendawan Hutan (Bahagian Bawah Kanan) */
        .creature-mushroom {
            bottom: 10px;
            right: 3%;
            width: 130px;
            height: auto;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes flyRight {
            0% { transform: translateX(-30vw) translateY(0px) scale(0.9); }
            50% { transform: translateX(45vw) translateY(-20px) scale(1.1); }
            100% { transform: translateX(115vw) translateY(10px) scale(0.9); }
        }

        @keyframes flutter {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(-8deg) scale(1.05); }
            75% { transform: translateY(15px) rotate(8deg) scale(0.95); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(-4deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 10px 20px rgba(255, 237, 213, 0.3)); }
        }

        body::before, body::after {
            content: "🍃";
            position: fixed;
            font-size: 2rem;
            opacity: 0.4;
            animation: leafFall 10s infinite linear;
            z-index: 0;
        }
        body::before { left: 18%; animation-duration: 11s; }
        body::after { right: 25%; animation-duration: 8s; animation-delay: 3s; }

        @keyframes leafFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(80px); opacity: 0; }
        }

        /* Kad Utama Glassmorphism Tema Hijau Cair & Oren Cair */
        .card {
            background: rgba(245, 253, 248, 0.93);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa; /* Frame Oren Cair */
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #166534;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 34px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #fed7aa; /* Bayangan Oren Cair */
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        /* TULISAN PAPARAN UTAMA (LABEL, INPUT, SELECT) - SAIZ 20px */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #166534;
            font-size: 20px !important;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #86efac; /* Hijau Cair */
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #f0fdf4; /* Soft Mint */
            color: #052e16;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        input[type="text"]:focus, select:focus {
            border-color: #fb923c; /* Focus Oren Cair */
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(253, 186, 116, 0.4);
        }

        .sub-title {
            text-align: center;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #c2410c; /* Oren gelap sedikit untuk kontras */
            font-size: 20px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-set {
            flex: 1;
            min-width: 220px;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 20px !important;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        /* GET SMART SET: Tona Hijau Cair */
        .btn-blue {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 6px 0px #15803d;
        }
        .btn-blue:hover { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); }

        /* REMEDIAL SET: Tona Oren Cair */
        .btn-green {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            box-shadow: 0 6px 0px #c2410c;
        }
        .btn-green:hover { background: linear-gradient(135deg, #fdba74 0%, #fb923c 100%); }

        /* READING CORNER: Tona Ungu Ceria */
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            box-shadow: 0 6px 0px #7e22ce;
        }
        .btn-purple:hover { background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%); }

        /* GRAMMAR FUN: Tona Merah Jambu / Magenta */
        .btn-pink {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 6px 0px #be185d;
        }
        .btn-pink:hover { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }

        /* SENTENCE BUILDER: Tona Teal Segar */
        .btn-teal {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            box-shadow: 0 6px 0px #0f766e;
        }
        .btn-teal:hover { background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%); }

        .btn-home {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            color: #052e16;
            padding: 12px 22px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0px #16a34a;
            transition: all 0.15s ease;
        }
        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #16a34a;
        }

        /* GAYA APABILA MODUL DIKUNCI (LOCKED STATE) */
        .locked {
            opacity: 0.45 !important;
            pointer-events: none !important;
            filter: grayscale(85%) !important;
            box-shadow: none !important;
            cursor: not-allowed !important;
        }

        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }

        /* Item Soalan & Kad Jawapan (Hijau Cair & Oren Cair) */
        .item-soalan {
            background-color: #ffffff;
            border: 3px solid #bbf7d0; /* Sisi Hijau Cair */
            border-left: 8px solid #fb923c; /* Jalur Akses Oren Cair */
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(22, 101, 52, 0.06);
        }

        /* TULISAN SOALAN - SAIZ 20px */
        .item-soalan h3 {
            font-size: 20px !important;
            color: #052e16;
            line-height: 1.5;
            font-weight: 700;
        }

        /* TULISAN PILIHAN JAWAPAN - SAIZ 20px */
        .pilihan-jawapan label {
            font-weight: 600;
            background: #f0fdf4; /* Hijau cair */
            padding: 16px 20px;
            border: 2px solid #dcfce7;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #166534;
            font-size: 20px !important;
        }

        .pilihan-jawapan label:hover {
            background-color: #ffedd5; /* Pertukaran ke Oren cair apabila tetikus lalu */
            border-color: #fed7aa;
            transform: translateX(4px);
        }

        .pilihan-jawapan input[type="radio"] {
            accent-color: #f97316; /* Warna radio button Oren */
            width: 22px;
            height: 22px;
        }

        .question-image-container {
            text-align: center;
            margin-bottom: 18px;
            background-color: #fff7ed; /* Oren sangat cair */
            padding: 12px;
            border: 2px dashed #fb923c;
            border-radius: 16px;
        }

        .question-image, .item-soalan img {
            width: 100% !important;
            max-width: 680px !important;
            height: auto !important;
            max-height: 500px !important;
            border-radius: 12px;
            object-fit: contain !important;
        }

        .item-soalan.img-small img,
        .question-image-container.img-small img {
            max-width: 320px !important;
            max-height: 220px !important;
            margin: 0 auto;
            display: block;
        }

            display: block;
            text-align: center;
            margin-top: 30px;
            color: #
