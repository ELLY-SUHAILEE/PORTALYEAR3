<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL YEAR 3 BAHASA INGGERIS 🌊</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* POSTER SEBAGAI LATAR BELAKANG UTAMA PORTAL */
      body {
    background: #0284c7 url('poster.png') no-repeat center top fixed;
    background-size: 100% 100%; /* Memaksa poster memenuhi keseluruhan skrin */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 12px 50px 12px;
    font-size: 20px;
}

        /* CONTAINER UTAMA (TANPA KOTAK KELABU) */
        .main-portal-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* KOTAK PUTIH KANDUNGAN */
        .inner-panel {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #0284c7;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
        }

        /* BORANG INPUT (NAME, CLASS, TOPIC) - SAIZ 20PX */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #1e3a8a;
            font-size: 20px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #93c5fd;
            border-radius: 14px;
            font-size: 20px;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3);
        }

        /* TAJUK SEKSYEN - SAIZ 20PX */
        .sub-title-section {
            text-align: center;
            font-weight: 800;
            margin-top: 22px;
            margin-bottom: 14px;
            color: #0284c7;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* SUSUNAN GRID BUTANG RESPONSIF */
        .btn-grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .btn-grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        /* BUTANG-BUTANG PORTAL - SAIZ 20PX */
        .btn-set {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid #1e293b;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0px #1e293b;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .btn-set:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0px #1e293b;
        }

        .btn-smart { background: linear-gradient(180deg, #10b981 0%, #059669 100%); }
        .btn-remedial { background: linear-gradient(180deg, #f97316 0%, #ea580c 100%); }
        .btn-purple { background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%); }
        .btn-pink { background: linear-gradient(180deg, #ec4899 0%, #be185d 100%); }
        .btn-teal { background: linear-gradient(180deg, #14b8a6 0%, #0f766e 100%); }

        .btn-home {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #422006;
            border: 3px solid #713f12;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0px #713f12;
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0284c7;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            padding: 12px;
            background: #e0f2fe;
            border-radius: 14px;
            border: 2px dashed #38bdf8;
        }

        /* SOALAN DAN PILIHAN - SAIZ 20PX */
        #papan-kuiz, #keputusan-kuiz { display: none; }

        .item-soalan {
            background-color: #ffffff;
            border: 3px solid #93c5fd;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        .item-soalan h3 {
            font-size: 20px;
            color: #1e293b;
            line-height: 1.4;
            font-weight: 800;
        }

        .pilihan-jawapan label {
            font-weight: 700;
            background: #f0f9ff;
            padding: 12px 16px;
            border: 2px solid #bae6fd;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #0f172a;
            font-size: 20px;
        }

        .pilihan-jawapan label:hover {
            background-color: #e0f2fe;
            border-color: #38bdf8;
        }

        /* TWEAK UNTUK SKRIN SANGAT KECIL (TELEFON) */
        @media (max-width: 480px) {
            .inner-panel {
                padding: 18px;
            }
            .btn-grid-2, .btn-grid-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="main-portal-container">
    <div class="inner-panel">
        <div id="borang-mula">
            <div class="form-group">
                <label for="nama">👤 Student Name:</label>
                <input type="text" id="nama" placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="kelas">🏫 Class:</label>
                <select id="kelas">
                    <option value="">-- Select Class --</option>
                    <option value="3 ARIF">3 ARIF</option>
                    <option value="3 BESTARI">3 BESTARI</option>
                    <option value="3 CERDIK">3 CERDIK</option>
                    <option value="3 DEDIKASI">3 DEDIKASI</option>
                    <option value="3 ELIT">3 ELIT</option>
                    <option value="3 FIRDAUS">3 FIRDAUS</option>
                    <option value="3 GIGIH">3 GIGIH</option>
                    <option value="3 HARMONI">3 HARMONI</option>
                    <option value="3 INOVATIF">3 INOVATIF</option>
                    <option value="3 JUARA">3 JUARA</option>
                    <option value="3 KREATIF">3 KREATIF</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="modul">📚 Select Learning Topic:</label>
                <select id="modul">
                    <option value="Topic 1">Topic 1: Welcome!</option>
                    <option value="Topic 2">Topic 2: Every day</option>
                    <option value="Topic 3">Topic 3: Right now</option>
                    <option value="Topic 4">Topic 4: Year in, year out</option>
                    <option value="Topic 5">Topic 5: My new house / Eating right</option>
                    <option value="Topic 6">Topic 6: Food, please! / Getting around</option>
                    <option value="Topic 7">Topic 7: Out and about / Helping out</option>
                    <option value="Topic 8">Topic 8: Where were you yesterday? / Amazing animals</option>
                    <option value="Topic 9">Topic 9: On holiday / Get active!</option>
                    <option value="Topic 10">Topic 10: The world around us</option>
                </select>
            </div>

            <div class="sub-title-section">⭐ SELECT QUIZ SET TO BEGIN ⭐</div>
            
            <div class="btn-grid-2">
                <button class="btn-set btn-smart" onclick="mulaKuiz('GET SMART SET')">🎮 GET SMART SET</button>
                <button class="btn-set btn-remedial" onclick="mulaKuiz('REMEDIAL SET')">🌟 REMEDIAL SET</button>
            </div>

            <div class="sub-title-section">🚀 SELF-EXPLORATION 🚀</div>

            <div class="btn-grid-3">
                <button class="btn-set btn-purple" onclick="bukaModulLain('reading.html')">📖 READING</button>
                <button class="btn-set btn-pink" onclick="bukaModulLain('grammar.html')">✏️ GRAMMAR</button>
                <button class="btn-set btn-teal" onclick="bukaModulLain('sentence.html')">🧩 SENTENCE</button>
            </div>

            <a href="javascript:void(0)" onclick="bukaDashboardGuru()" class="link-guru">🔒 Teacher's Dashboard</a>
        </div>

        <!-- PAPAN KUIZ -->
        <div id="papan-kuiz">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px;">
                <button class="btn-home" onclick="keHalamanUtama()">🏠 HOME</button>
                <span id="label-modul-papar" style="font-weight: 800; color: #1e3a8a; font-size: 20px; text-align: right;"></span>
            </div>
            <div id="bekas-senarai-soalan"></div>
            <div class="btn-grid-2" style="margin-top: 18px;">
                <button class="btn-home" onclick="keHalamanUtama()">🏠 HOME</button>
                <button class="btn-set btn-smart" onclick="hantarKuiz()">🚀 SUBMIT</button>
            </div>
        </div>

        <!-- KEPUTUSAN KUIZ -->
        <div id="keputusan-kuiz" style="text-align: center;"></div>
    </div>
</div>

<!-- SCRIPTS JS -->
<script src="module1.js"></script>
<script src="module2.js"></script>
<script src="module3.js"></script>
<script src="module4.js"></script>
<script src="module5.js"></script>
<script src="module6.js"></script>
<script src="module7.js"></script>
<script src="module8.js"></script>
<script src="module9.js"></script>
<script src="module10.js"></script>

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function bukaModulLain(url) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;

        if (!nama || !kelas) {
            alert("Please enter your name and select a class first!");
            return;
        }

        localStorage.setItem('pelajar_aktif', JSON.stringify({ nama, kelas }));
        window.location.href = url;
    }

    function bukaDashboardGuru() {
        const inputLaluan = prompt("🔑 Please enter Teacher's password:");
        if (inputLaluan === "guru123" || inputLaluan === "1234") {
            try { sessionStorage.setItem("guru_authenticated", "true"); } catch(e){}
            window.location.href = "dashboard.html";
        } else if (inputLaluan !== null) {
            alert("❌ Incorrect password!");
        }
    }

    function keHalamanUtama() {
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Please enter your name, select a class, and select a topic first!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("quizBank data not found!");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';

        const kunciPadan = modulKeys.find(key => {
            const matchKey = key.match(/\d+/);
            return (matchKey ? matchKey[0] : '') === nomborModul;
        });

        if (!kunciPadan) {
            alert(`Question data for ${modulInput} not found.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};
        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;
            htmlContent += `<div class="item-soalan">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `<div style="text-align:center; margin-bottom:12px;"><img src="${imgStr}" style="max-width:100%; height:auto; border-radius:10px;"></div>`;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');
            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan" style="margin-top: 10px;">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="jawapanPengguna[${index}]='${pilihan}'">
                        <span style="margin-left: 10px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`You have only answered ${dijawab} out of ${jumlahSoalan} questions. Submit anyway?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) markah++;
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('en-GB')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #0f172a; font-size: 26px;">🎉 Quiz Results</h2>
            <div style="background: #ffffff; padding: 18px; border-radius: 14px; text-align: left; margin: 16px 0; border: 3px solid #bae6fd; font-size: 20px;">
                <p style="margin-bottom: 8px;"><strong>👤 Name:</strong> ${maklumatPelajar.nama}</p>
                <p style="margin-bottom: 8px;"><strong>🏫 Class:</strong> ${maklumatPelajar.kelas}</p>
                <p style="margin-bottom: 8px;"><strong>📚 Topic:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 28px; color: #16a34a; margin: 16px 0;">Score: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="padding: 12px 24px;">🏠 Main Menu (HOME)</button>
        `;
    }
</script>

</body>
</html>
