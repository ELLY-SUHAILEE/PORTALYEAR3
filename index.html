<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - UASA Digital Ocean Quest 🌊</title>
    <!-- Font Mesra Kanak-Kanak & Bubbly -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Nunito', sans-serif;
        }

        /* LATAR BELAKANG LAUTAN PERSIS GRAFIK (GRADIENT BIRU AIR) */
        body {
            background: linear-gradient(180deg, #6fd5fc 0%, #3ca0e7 40%, #1a6fbf 85%, #0e4e96 100%);
            margin: 0;
            padding: 20px 10px 120px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* HEADING UTAMA PERSIS TAJUK "UASA DIGITAL" */
        .header-title-container {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .main-title {
            font-size: 48px;
            font-weight: 900;
            color: #0d3b66;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                3px 3px 0px #ffffff,
               -3px -3px 0px #ffffff,
                3px -3px 0px #ffffff,
               -3px 3px 0px #ffffff,
                0px 6px 12px rgba(0,0,0,0.25);
        }

        .sub-title-header {
            font-size: 24px;
            font-weight: 700;
            color: #082846;
            margin-top: 5px;
            text-shadow: 1px 1px 0px #ffffff;
        }

        /* 3 BUIH KACA DI BAHAGIAN ATAS (STEPS BUBBLES) */
        .bubbles-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
        }

        .step-bubble {
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95), rgba(186, 230, 253, 0.75));
            border: 4px solid #ffffff;
            box-shadow: 0 10px 20px rgba(0, 50, 100, 0.2), inset -4px -4px 8px rgba(2, 132, 199, 0.25);
            border-radius: 50%;
            width: 170px;
            height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .step-bubble:hover {
            transform: scale(1.05);
        }

        .step-bubble .icon {
            font-size: 38px;
            margin-bottom: 4px;
        }

        .step-bubble .text {
            font-size: 17px;
            font-weight: 700;
            color: #0f3854;
            line-height: 1.2;
        }

        .arrow-connect {
            width: 50px;
            height: 30px;
        }

        /* IKAN LUMBA-LUMBA (DOLPHINS) */
        .dolphin-svg {
            position: absolute;
            z-index: 12;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2));
        }

        .dolphin-top-right {
            top: 60px;
            right: 5%;
            width: 130px;
            transform: rotate(-10deg);
        }

        .dolphin-mid-right {
            top: 250px;
            right: 3%;
            width: 150px;
            transform: rotate(15deg);
        }

        /* STRUKTUR BATU BATAN UTAMA (STONE FORMATION) */
        .rock-container {
            background: linear-gradient(145deg, #a3998e 0%, #80766b 50%, #61574d 100%);
            border: 6px solid #473e35;
            border-radius: 40px;
            box-shadow: 
                inset 0 8px 0 rgba(255,255,255,0.25),
                inset 0 -10px 0 rgba(0,0,0,0.35),
                0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 820px;
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        .rock-badge {
            background: linear-gradient(180deg, #b5aba0 0%, #8c8277 100%);
            border: 4px solid #473e35;
            border-radius: 20px;
            padding: 10px 25px;
            display: inline-block;
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 6px 0 #362e27;
        }

        .rock-badge h2 {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            text-shadow: 2px 2px 0 #362e27;
            text-transform: uppercase;
        }

        /* BORANG & INPUT PADA BATU */
        .inner-stone-panel {
            background: #fdfbf7;
            border: 4px solid #8c8277;
            border-radius: 24px;
            padding: 25px;
            margin-top: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            color: #2d261e;
            font-size: 20px !important;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid #b8aea1;
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #fffefb;
            color: #2d261e;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.4);
        }

        .sub-title {
            text-align: center;
            font-weight: 800;
            margin-top: 25px;
            margin-bottom: 15px;
            color: #2d261e;
            font-size: 20px !important;
            text-transform: uppercase;
        }

        /* BUTANG PILIHAN SEPERTI BATU / SUBJEK */
        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-set {
            flex: 1;
            min-width: 200px;
            padding: 16px 20px;
            border: 3px solid #362e27;
            border-radius: 20px;
            font-size: 20px !important;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0px #362e27;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-shadow: 1px 2px 0px rgba(0,0,0,0.4);
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #362e27;
        }

        /* BUTANG BERWARNA TEMATIK */
        .btn-blue { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); }
        .btn-green { background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); }
        .btn-purple { background: linear-gradient(180deg, #c084fc 0%, #9333ea 100%); }
        .btn-pink { background: linear-gradient(180deg, #f472b6 0%, #db2777 100%); }
        .btn-teal { background: linear-gradient(180deg, #2dd4bf 0%, #0d9488 100%); }

        .btn-home {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #422006;
            border: 3px solid #713f12;
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0px #713f12;
            text-shadow: none;
        }

        #papan-kuiz, #keputusan-kuiz { display: none; }

        .item-soalan {
            background-color: #ffffff;
            border: 4px solid #b8aea1;
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        .item-soalan h3 {
            font-size: 20px !important;
            color: #2d261e;
            line-height: 1.5;
            font-weight: 800;
        }

        .pilihan-jawapan label {
            font-weight: 700;
            background: #fdfbf7;
            padding: 14px 18px;
            border: 2px solid #d6ce2;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #2d261e;
            font-size: 20px !important;
        }

        .pilihan-jawapan label:hover {
            background-color: #e0f2fe;
            border-color: #38bdf8;
        }

        .question-image-container {
            text-align: center;
            margin-bottom: 16px;
            background-color: #f0f9ff;
            padding: 10px;
            border: 2px dashed #38bdf8;
            border-radius: 16px;
        }

        .question-image, .item-soalan img {
            width: 100% !important;
            max-width: 680px !important;
            height: auto !important;
            max-height: 500px !important;
            border-radius: 12px;
            object-fit: contain !important;
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #473e35;
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            padding: 10px;
            background: #e8e2d8;
            border-radius: 12px;
            border: 2px solid #b8aea1;
        }

        /* BAHAGIAN DASAR LAUT (SAND BED & BANNER) */
        .ocean-bottom-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            border-top: 6px solid #a16207;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PARCHMENT BANNER DENGAN PENYU */
        .banner-scroll-wrapper {
            position: fixed;
            bottom: 18px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 90%;
            max-width: 750px;
        }

        .parchment-banner {
            background: #fff9db;
            border: 4px solid #854d0e;
            border-radius: 20px;
            padding: 12px 25px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #713f12;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            flex: 1;
        }

        /* ELEMEN HIDUPAN SISIAN (DECORATIONS) */
        .side-creature {
            position: absolute;
            z-index: 8;
            pointer-events: none;
        }

        .coral-left { bottom: 80px; left: 10px; width: 140px; }
        .coral-right { bottom: 80px; right: 10px; width: 150px; }
        .crab-left { bottom: 105px; left: 120px; width: 60px; }
        .seahorse-right { bottom: 120px; right: 130px; width: 50px; }
        .chest-right { bottom: 30px; right: 25px; width: 100px; z-index: 22; }
    </style>
</head>

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function bukaModulLain(url) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;

        if (!nama || !kelas) {
            alert("Sila isi Nama dan pilih Kelas anda terlebih dahulu sebelum menekan butang penerokaan!");
            return;
        }

        localStorage.setItem('pelajar_aktif', JSON.stringify({ nama, kelas }));
        window.location.href = url;
    }

    function bukaDashboardGuru() {
        const inputLaluan = prompt("🔑 Please enter Teacher's password:");

        if (inputLaluan === "guru123" || inputLaluan === "1234") {
            try {
                sessionStorage.setItem("guru_authenticated", "true");
            } catch(e) {
                console.log("sessionStorage blocked by browser.");
            }
            window.location.href = "dashboard.html";
        } else if (inputLaluan !== null) {
            alert("❌ Incorrect password! Access denied.");
        }
    }

    function keHalamanUtama() {
        if (document.getElementById('papan-kuiz').style.display === 'block') {
            if (!confirm("Are you sure you want to return to Home? Your current answers will not be saved.")) {
                return;
            }
        }
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Please enter your name, select a class, and select a topic first!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("quizBank data not found! Make sure the module JS files are loaded.");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';

        const kunciPadan = modulKeys.find(key => {
            const matchKey = key.match(/\d+/);
            const nomborKey = matchKey ? matchKey[0] : '';
            return nomborKey === nomborModul;
        });

        if (!kunciPadan) {
            alert(`Question data for ${modulInput} (${setTerpilih}) not found. Please ensure the module*.js file contains data for this topic.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};

        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;

            htmlContent += `<div class="item-soalan">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `
                        <div class="question-image-container">
                            <img src="${imgStr}" alt="Question ${nomborSoalan}" class="question-image" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:red;font-size:16px;\\'>[Failed to load image: ${imgStr}]</span>';">
                        </div>
                    `;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');

            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="pilihJawapan(${index}, '${pilihan}')">
                        <span style="margin-left: 14px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function pilihJawapan(index, pilihan) {
        jawapanPengguna[index] = pilihan;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`You have only answered ${dijawab} out of ${jumlahSoalan} questions. Are you sure you want to submit?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) {
                markah++;
            }
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('en-GB')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #2d261e; font-size: 30px;">🎉 Quiz Results</h2>
            <div style="background: #fffefb; padding: 22px; border-radius: 18px; text-align: left; margin: 20px 0; border: 3px solid #b8aea1; font-size: 20px;">
                <p><strong>👤 Name:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>🏫 Class:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>📚 Topic:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 32px; color: #16a34a; margin: 15px 0;">⭐ Score: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="margin-top: 15px; padding: 14px 28px; font-size: 20px;">🏠 Main Menu (HOME)</button>
        `;
    }
</script>

</body>
</html>
