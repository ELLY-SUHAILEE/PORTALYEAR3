<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kuiz Bahasa Inggeris Year 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Muat naik data soalan dari module1.js -->
    <script src="module1.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="max-w-3xl mx-auto w-full bg-white rounded-2xl shadow-md p-4 mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-3 rounded-xl shadow">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">PORTAL KUIZ YEAR 3</h1>
                    <p class="text-xs text-gray-500">English Module 1: Welcome!</p>
                </div>
            </div>

            <!-- Set Selector -->
            <div class="flex items-center gap-2 bg-gray-100 p-1.5 rounded-xl w-full md:w-auto">
                <button id="btn-getsmart" onclick="switchSet('GET SMART SET')" class="flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm">
                    GET SMART SET
                </button>
                <button id="btn-remedial" onclick="switchSet('REMEDIAL SET')" class="flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600">
                    REMEDIAL SET
                </button>
            </div>
        </div>
    </header>

    <!-- Main Quiz Container -->
    <main class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-lg border border-gray-100 p-6 md:p-8 mb-6">
        
        <!-- Category Dropdown & Progress Bar -->
        <div class="mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
                <span id="category-badge" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider">
                    Reading
                </span>
                <span id="question-count" class="text-sm font-semibold text-gray-500">
                    Soalan 1 / 30
                </span>
            </div>
            <!-- Progress Line -->
            <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 3.33%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="space-y-6">

            <!-- 1. GAMBAR DILETAKKAN SEBELUM SOALAN (SAIZ KECIL & KEMAS) -->
            <div id="image-container" class="hidden text-center my-4">
                <div class="inline-block relative group">
                    <img id="question-image" 
                         src="" 
                         alt="Gambar Soalan" 
                         class="max-w-[260px] sm:max-w-[320px] max-h-[200px] sm:max-h-[240px] mx-auto object-contain rounded-2xl shadow-md border-2 border-indigo-100 bg-gray-50 transition-transform duration-200 hover:scale-105">
                </div>
            </div>

            <!-- 2. TEKS SOALAN -->
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                <p id="question-text" class="text-base sm:text-lg font-bold text-slate-800 whitespace-pre-line leading-relaxed">
                    Sedang memuatkan soalan...
                </p>
            </div>

            <!-- 3. PILIHAN JAWAPAN -->
            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Pilihan jawapan akan dimasukkan di sini secara dinamik -->
            </div>

            <!-- Feedback Message -->
            <div id="feedback-box" class="hidden p-4 rounded-xl text-sm font-semibold text-center transition-all"></div>

        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center mt-8 pt-6 border-t border-gray-100">
            <button id="btn-prev" onclick="prevQuestion()" class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-600 text-sm font-medium hover:bg-gray-50 transition flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-left"></i> Sebelum
            </button>
            <div class="text-sm font-bold text-gray-700">
                Markah: <span id="score-text" class="text-indigo-600 text-base">0</span>
            </div>
            <button id="btn-next" onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-md shadow-indigo-200 transition flex items-center gap-2">
                Seterusnya <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 py-2">
        Portal Kuiz Interaktif Bahasa Inggeris Tahun 3 &bull; Module 1
    </footer>

    <!-- Script Logik Portal Kuiz -->
    <script>
        let currentSet = "GET SMART SET";
        let allQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = {};

        function initQuiz() {
            if (typeof quizBank === 'undefined' || !quizBank[currentSet]) {
                document.getElementById('question-text').innerText = "Ralat: Data kuiz tidak dijumpai dalam module1.js!";
                return;
            }

            allQuestions = [];
            const moduleData = quizBank[currentSet]["Module 1: Welcome!"];

            // Gabungkan semua soalan mengikut kategori
            for (let category in moduleData) {
                moduleData[category].forEach((q) => {
                    allQuestions.push({
                        ...q,
                        category: category
                    });
                });
            }

            currentIndex = 0;
            score = 0;
            userAnswers = {};
            document.getElementById('score-text').innerText = score;
            renderQuestion();
        }

        function switchSet(setName) {
            currentSet = setName;
            
            // Tukar Gaya Butang
            const btnGetSmart = document.getElementById('btn-getsmart');
            const btnRemedial = document.getElementById('btn-remedial');

            if (setName === 'GET SMART SET') {
                btnGetSmart.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm";
                btnRemedial.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600";
            } else {
                btnRemedial.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm";
                btnGetSmart.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600";
            }

            initQuiz();
        }

        function renderQuestion() {
            if (allQuestions.length === 0) return;

            const q = allQuestions[currentIndex];

            // Kemas Kini Tajuk & Kemajuan
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('question-count').innerText = `Soalan ${currentIndex + 1} / ${allQuestions.length}`;
            
            const progressPercent = ((currentIndex + 1) / allQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // GAMBAR (SEBELUM SOALAN)
            const imgContainer = document.getElementById('image-container');
            const imgElem = document.getElementById('question-image');

            if (q.image && q.image.trim() !== '') {
                imgElem.src = q.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgElem.src = '';
                imgContainer.classList.add('hidden');
            }

            // TEKS SOALAN
            document.getElementById('question-text').innerText = q.q;

            // PILIHAN JAWAPAN
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('hidden');

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition duration-150 font-medium text-gray-700 flex justify-between items-center";
                btn.innerText = opt;

                // Jika soalan ini telah dijawab
                if (userAnswers[currentIndex]) {
                    btn.disabled = true;
                    if (opt === q.ans) {
                        btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'font-bold');
                    } else if (opt === userAnswers[currentIndex].selected) {
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    }
                } else {
                    btn.onclick = () => selectOption(opt, q.ans);
                }

                optionsContainer.appendChild(btn);
            });

            // Status Butang Navigasi
            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            
            if (currentIndex === allQuestions.length - 1) {
                document.getElementById('btn-next').innerText = "Tamat Kuiz";
            } else {
                document.getElementById('btn-next').innerHTML = `Seterusnya <i class="fa-solid fa-arrow-right"></i>`;
            }
        }

        function selectOption(selectedOpt, correctAns) {
            const isCorrect = (selectedOpt === correctAns);
            
            if (isCorrect) {
                score += 1;
            }

            userAnswers[currentIndex] = {
                selected: selectedOpt,
                correct: isCorrect
            };

            document.getElementById('score-text').innerText = score;
            renderQuestion();

            // Papar Maklum Balas
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (isCorrect) {
                feedbackBox.classList.add('bg-green-100', 'text-green-800');
                feedbackBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Syabas! Jawapan anda TEPAT.';
            } else {
                feedbackBox.classList.add('bg-red-100', 'text-red-800');
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Maaf, jawapan tidak tepat. Jawapan betul: <b>${correctAns}</b>`;
            }
        }

        function nextQuestion() {
            if (currentIndex < allQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert(`Kuiz Selesai!\nJumlah Markah Anda: ${score} / ${allQuestions.length}`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // Jalankan apabila portal mula dimuatkan
        window.onload = initQuiz;
    </script>
</body>
</html>
