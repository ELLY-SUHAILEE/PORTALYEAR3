<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Forest English Quest 🌲</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Hijau Emerald Terang */
        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN & ELEMENT HUTAN / KABIN / GUNUNG */
        .forest-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .creature-bird {
            top: 6%;
            width: 220px;
            height: auto;
            animation: flyRight 22s infinite linear;
            opacity: 0.9;
        }

        .creature-owl {
            top: 10%;
            right: 4%;
            width: 130px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            opacity: 0.95;
        }

        .creature-butterfly1 {
            top: 38%;
            left: 3%;
            width: 100px;
            height: auto;
            animation: flutter 9s infinite ease-in-out;
        }

        .creature-butterfly2 {
            top: 52%;
            right: 4%;
            width: 90px;
            height: auto;
            animation: flutter 11s infinite ease-in-out;
            animation-delay: 2s;
        }

        /* Kabin & Gunung Hutan (Bahagian Bawah Kiri) */
        .creature-cabin {
            bottom: 10px;
            left: 2%;
            width: 220px;
            height: auto;
            animation: pulseGlow 5s infinite alternate;
        }

        /* Cendawan Hutan (Bahagian Bawah Kanan) */
        .creature-mushroom {
            bottom: 10px;
            right: 3%;
            width: 130px;
            height: auto;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes flyRight {
            0% { transform: translateX(-30vw) translateY(0px) scale(0.9); }
            50% { transform: translateX(45vw) translateY(-20px) scale(1.1); }
            100% { transform: translateX(115vw) translateY(10px) scale(0.9); }
        }

        @keyframes flutter {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(-8deg) scale(1.05); }
            75% { transform: translateY(15px) rotate(8deg) scale(0.95); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(-4deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 10px 20px rgba(255, 237, 213, 0.3)); }
        }

        body::before, body::after {
            content: "🍃";
            position: fixed;
            font-size: 2rem;
            opacity: 0.4;
            animation: leafFall 10s infinite linear;
            z-index: 0;
        }
        body::before { left: 18%; animation-duration: 11s; }
        body::after { right: 25%; animation-duration: 8s; animation-delay: 3s; }

        @keyframes leafFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(80px); opacity: 0; }
        }

        /* Kad Utama Glassmorphism Tema Hijau Cair & Oren Cair */
        .card {
            background: rgba(245, 253, 248, 0.93);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa; /* Frame Oren Cair */
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-top .brand {
            color: #be185d;
            font-weight: 700;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 {
            color: #be185d;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 12px;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .instruction {
            text-align: center;
            color: #be185d;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        /* TULISAN PAPARAN UTAMA (LABEL, INPUT, SELECT) - SAIZ 20px */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #be185d;
            font-size: 20px !important;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #ec4899;
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #ffffff;
            color: #052e16;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2);
        }

        .sub-title {
            text-align: left;
            font-weight: 700;
            margin-top: 25px;
            margin-bottom: 15px;
            color: #be185d;
            font-size: 20px !important;
            letter-spacing: 0.5px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-set {
            flex: 1;
            min-width: 220px;
            padding: 16px;
            border: 2px solid #ec4899;
            border-radius: 18px;
            font-size: 20px !important;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .btn-pink {
            background: #db2777;
            color: #ffffff;
            border-color: #be185d;
            box-shadow: 0 6px 0px #9d174d;
        }

        .btn-outline-pink {
            background: #ffffff;
            color: #db2777;
            border: 2px solid #ec4899;
            box-shadow: 0 6px 0px #fbcfe8;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        .btn-home {
            background: #4ade80;
            color: #052e16;
            padding: 10px 20px;
            border: 2px solid #16a34a;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0px #15803d;
            transition: all 0.15s ease;
        }

        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #15803d;
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #be185d;
            font-weight: 600;
            text-decoration: none;
            font-size: 18px;
        }

        .link-guru:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-top">
            <button class="btn-home">🏠 HOME</button>
            <div class="brand">Grammar Fun ✏️</div>
        </div>

        <h1>✏️ Year 3 Grammar & Tenses</h1>
        <p class="instruction">Enter your name, select a category and topic to read notes & test your skills!</p>

        <div class="form-group">
            <label for="studentName">👤 Student Name:</label>
            <input type="text" id="studentName" placeholder="Type your full name here...">
        </div>

        <div class="btn-container">
            <button class="btn-set btn-pink">📘 GRAMMAR</button>
            <button class="btn-set btn-outline-pink">⏰ TENSES & VERBS</button>
        </div>

        <div class="sub-title">📌 Select Topic:</div>
        <div class="form-group">
            <select id="topicSelect">
                <option value="">-- Choose a Topic --</option>
                <option value="topic1">Topic 1: Nouns & Pronouns</option>
                <option value="topic2">Topic 2: Present & Past Tense</option>
            </select>
        </div>

        <a href="#" class="link-guru">🔑 Teacher / Admin Access</a>
    </div>

</body>
</html>
