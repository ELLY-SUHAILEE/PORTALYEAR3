<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kuiz Bahasa Inggeris Tahun 4</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
        }
        h1, h2 {
            color: #1a73e8;
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-group-set {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-gs {
            background-color: #1a73e8;
            color: white;
        }
        .btn-gs:hover {
            background-color: #1557b0;
        }
        .btn-remedial {
            background-color: #34a853;
            color: white;
        }
        .btn-remedial:hover {
            background-color: #2d8e47;
        }
        .btn-nav {
            background-color: #f1f3f4;
            color: #333;
            border: 1px solid #ccc;
        }
        .btn-nav:hover {
            background-color: #e0e0e0;
        }
        .btn-submit {
            background-color: #ea4335;
            color: white;
        }
        .btn-submit:hover {
            background-color: #d93025;
        }
        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }
        .soalan-box {
            background-color: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .pilihan-jawapan label {
            font-weight: normal;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: background 0.1s;
        }
        .pilihan-jawapan label:hover {
            background-color: #f1f8ff;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .progress-bar {
            font-weight: bold;
            color: #666;
            margin-bottom: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. BORANG MAKLUMAT PELAJAR & PILIHAN MODUL -->
    <div id="borang-mula">
        <h1>Kuiz Bahasa Inggeris Tahun 4</h1>
        <div class="form-group">
            <label for="nama">Nama Pelajar:</label>
            <input type="text" id="nama" placeholder="Masukkan nama penuh" required>
        </div>
        <div class="form-group">
            <label for="kelas">Kelas:</label>
            <input type="text" id="kelas" placeholder="Contoh: 4 Cemerlang" required>
        </div>
        <div class="form-group">
            <label for="modul">Pilih Modul:</label>
            <select id="modul">
                <option value="Module 1: Where are you from?">Module 1: Where are you from?</option>
                <option value="Module 2: My week">Module 2: My week</option>
                <option value="Module 3: Right now">Module 3: Right now</option>
                <option value="Module 4: Celebrations">Module 4: Celebrations</option>
                <option value="Module 5: My new house / Eating right">Module 5: My new house / Eating right</option>
                <option value="Module 6: Food, please! / Getting around">Module 6: Food, please! / Getting around</option>
                <option value="Module 7: Out and about / Helping out">Module 7: Out and about / Helping out</option>
                <option value="Module 8: Where were you yesterday? / Amazing animals">Module 8: Where were you yesterday? / Amazing animals</option>
                <option value="Module 9: On Holiday">Module 9: On Holiday</option>
                <option value="Module 10: World Around Us">Module 10: World Around Us</option>
            </select>
        </div>

        <p style="text-align: center; font-weight: bold; margin-top: 20px;">Pilih Set Kuiz Untuk Bermula:</p>
        <div class="btn-group-set">
            <button class="btn-gs" onclick="mulaKuiz('GET SMART SET')">GET SMART SET</button>
            <button class="btn-remedial" onclick="mulaKuiz('REMEDIAL SET')">REMEDIAL SET</button>
        </div>
    </div>

    <!-- 2. PAPAN PAPARAN SOALAN KUIZ -->
    <div id="papan-kuiz">
        <div id="soalan-kemajuan" class="progress-bar"></div>
        <div class="soalan-box">
            <div id="kandungan-soalan"></div>
        </div>
        <div class="nav-buttons">
            <button id="btn-sebelum" class="btn-nav" onclick="soalanSebelum()">Anak Panah Kiri (Sebelum)</button>
            <button id="btn-seterusnya" class="btn-nav" onclick="soalanSeterusnya()">Anak Panah Kanan (Seterusnya)</button>
            <button id="btn-hantar" class="btn-submit" onclick="hantarKuiz()" style="display: none;">Hantar Jawapan</button>
        </div>
    </div>

    <!-- 3. PAPARAN KEPUTUSAN -->
    <div id="keputusan-kuiz" style="text-align: center;"></div>
</div>

<!-- MEMUATKAN FAIL MODUL 1 HINGGA 10 -->
<script src="module1.js"></script>
<script src="module2.js"></script>
<script src="module3.js"></script>
<script src="module4.js"></script>
<script src="module5.js"></script>
<script src="module6.js"></script>
<script src="module7.js"></script>
<script src="module8.js"></script>
<script src="module9.js"></script>
<script src="module10.js"></script>

<!-- LOGIK KAWALAN APLIKASI KUIZ -->
<script>
    let soalanSemasa = [];
    let indeksSoalan = 0;
    let markah = 0;
    let jawapanPengguna = [];
    let maklumatPelajar = {};

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value.trim();
        const modul = document.getElementById('modul').value;

        if (!nama || !kelas || !modul) {
            alert("Sila isi nama, kelas, dan pilih modul terlebih dahulu!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih] || !quizBank[setTerpilih][modul]) {
            alert("Data soalan untuk modul ini tidak dijumpai. Pastikan fail JS dimuatkan dengan betul.");
            return;
        }

        maklumatPelajar = { nama, kelas, modul, set: setTerpilih };
        const dataModul = quizBank[setTerpilih][modul];
        soalanSemasa = [];

        // Menggabungkan semua kategori (Reading, Vocabulary, Grammar, Writing, Speaking, Mixed Skills)
        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        indeksSoalan = 0;
        markah = 0;
        jawapanPengguna = new Array(soalanSemasa.length).fill(null);

        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSoalan();
    }

    function paparSoalan() {
        const data = soalanSemasa[indeksSoalan];
        
        document.getElementById('soalan-kemajuan').innerText = `Soalan ${indeksSoalan + 1} daripada ${soalanSemasa.length}`;

        const bekasSoalan = document.getElementById('kandungan-soalan');
        let htmlSoalan = '';

        if (data.image) {
            htmlSoalan += data.image;
        }
        
        htmlSoalan += `<h3 style="white-space: pre-line; margin-top: 10px; color: #333;">${data.q}</h3>`;
        htmlSoalan += `<div class="pilihan-jawapan">`;

        data.options.forEach((pilihan) => {
            const dipilih = jawapanPengguna[indeksSoalan] === pilihan ? 'checked' : '';
            htmlSoalan += `
                <label>
                    <input type="radio" name="jawapan" value="${pilihan}" ${dipilih} onchange="pilihJawapan('${pilihan}')">
                    <span style="margin-left: 10px;">${pilihan}</span>
                </label>
            `;
        });

        htmlSoalan += `</div>`;
        bekasSoalan.innerHTML = htmlSoalan;

        // Kawalan Butang Navigasi
        const btnSebelum = document.getElementById('btn-sebelum');
        const btnSeterusnya = document.getElementById('btn-seterusnya');
        const btnHantar = document.getElementById('btn-hantar');

        btnSebelum.style.display = indeksSoalan === 0 ? 'none' : 'inline-block';
        btnSeterusnya.style.display = indeksSoalan === soalanSemasa.length - 1 ? 'none' : 'inline-block';
        btnHantar.style.display = indeksSoalan === soalanSemasa.length - 1 ? 'inline-block' : 'none';
    }

    function pilihJawapan(pilihan) {
        jawapanPengguna[indeksSoalan] = pilihan;
    }

    function soalanSebelum() {
        if (indeksSoalan > 0) {
            indeksSoalan--;
            paparSoalan();
        }
    }

    function soalanSeterusnya() {
        if (indeksSoalan < soalanSemasa.length - 1) {
            indeksSoalan++;
            paparSoalan();
        }
    }

    function hantarKuiz() {
        const belumJawab = jawapanPengguna.filter(j => j === null).length;
        if (belumJawab > 0) {
            if (!confirm(`Terdapat ${belumJawab} soalan belum dijawab. Adakah anda pasti ingin menghantar?`)) {
                return;
            }
        }

        markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) {
                markah++;
            }
        });

        const peratus = Math.round((markah / soalanSemasa.length) * 100);

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2>Tahniah! Kuiz Selesai</h2>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: left; margin: 20px 0; border: 1px solid #ddd;">
                <p><strong>Nama:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>Kelas:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>Modul:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 28px; color: #1a73e8; margin: 10px 0;">Markah: ${markah} / ${soalanSemasa.length} (${peratus}%)</h3>
            <button class="btn-gs" onclick="location.reload()" style="max-width: 250px; margin-top: 15px;">Kembali ke Halaman Utama</button>
        `;
    }
</script>

</body>
</html>
