<!-- LOGIK KAWALAN APLIKASI -->
    <script>
        let soalanSemasa = [];

        function mulaKuiz(setTerpilih) {
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;
            const modul = document.getElementById('modul').value;

            if (!nama) { alert("Sila masukkan nama murid!"); return; }
            if (!kelas) { alert("Sila pilih kelas!"); return; }
            if (!modul) { alert("Sila pilih modul!"); return; }

            // 1. Tukar Paparan
            document.querySelector('.main-card').style.display = 'none';
            document.querySelector('.quiz-container-wrapper').style.display = 'block';

            // 2. Kemaskini Header Gelap
            document.getElementById('header-student').textContent = `Murid: ${nama} (${kelas}) | ${setTerpilih}`;
            document.getElementById('header-module').textContent = modul;

            // 3. Muat Soalan
            paparSoalan(modul, setTerpilih);
        }

        function kembaliKeMenu() {
            document.querySelector('.quiz-container-wrapper').style.display = 'none';
            document.querySelector('.main-card').style.display = 'block';
        }

        function paparSoalan(modul, set) {
            const quizBox = document.getElementById('quiz-box');
            quizBox.innerHTML = ''; 
            soalanSemasa = [];

            // Semakan pelbagai variasi nama modul (Contoh: "Module 1" ATAU "Module 1: Welcome!")
            let targetData = null;
            if (window.quizBank && window.quizBank[set]) {
                const availableKeys = Object.keys(window.quizBank[set]);
                const matchedKey = availableKeys.find(key => key.startsWith(modul));
                if (matchedKey) {
                    targetData = window.quizBank[set][matchedKey];
                }
            }

            if (targetData) {
                // Jika data dibahagikan mengikut Kategori (Reading, Grammar, dsb)
                if (Array.isArray(targetData)) {
                    soalanSemasa = targetData;
                } else {
                    Object.keys(targetData).forEach(category => {
                        soalanSemasa = soalanSemasa.concat(targetData[category]);
                    });
                }

                document.getElementById('header-score').textContent = `0 / ${soalanSemasa.length * 10}`;

                soalanSemasa.forEach((item, index) => {
                    const qDiv = document.createElement('div');
                    qDiv.style.marginBottom = "25px";
                    qDiv.style.paddingBottom = "15px";
                    qDiv.style.borderBottom = "1px solid #e2e8f0";

                    let htmlContent = `<p style="font-weight:700; font-size:1.1rem; color:#1d4e89; margin-bottom:12px;">${item.q}</p>`;
                    
                    if (item.image) {
                        htmlContent += `<div style="margin-bottom:15px;"><img src="${item.image}" style="max-width:100%; max-height:250px; border-radius:10px; border:1px solid #ddd;" onerror="this.style.display='none'"></div>`;
                    }

                    htmlContent += `<div style="display:flex; flex-direction:column; gap:10px;">`;
                    item.options.forEach((opt) => {
                        htmlContent += `
                            <label class="option-label">
                                <input type="radio" name="question_${index}" value="${opt}" onchange="semakJawapan()"> ${opt}
                            </label>
                        `;
                    });
                    htmlContent += `</div>`;

                    qDiv.innerHTML = htmlContent;
                    quizBox.appendChild(qDiv);
                });

            } else {
                quizBox.innerHTML = `
                    <div style="text-align:center; padding: 30px 10px;">
                        <h3 style="color:#e53e3e; margin-bottom:8px;">Soalan Belum Disediakan</h3>
                        <p style="color:#718096;">Fail soalan bagi <strong>${modul} (${set})</strong> belum dimasukkan ke dalam modul ini.</p>
                    </div>
                `;
                document.getElementById('header-score').textContent = `0 / 0`;
            }
        }

        function semakJawapan() {
            let jumlahMarkah = 0;
            soalanSemasa.forEach((item, idx) => {
                const selected = document.querySelector(`input[name="question_${idx}"]:checked`);
                if (selected) {
                    const jawapanBetul = item.ans || item.answer;
                    if (selected.value === jawapanBetul) {
                        jumlahMarkah += 10;
                    }
                }
            });
            document.getElementById('header-score').textContent = `${jumlahMarkah} / ${soalanSemasa.length * 10}`;
        }
    </script>
