<!DOCTYPE html>
<html lang="ms">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Nunito', sans-serif;
        }

        /* LATAR BELAKANG GAMBAR POSTER + FALLBACK GRADIENT */
        body {
            background: #0b4f8c url('poster.png') no-repeat center top fixed;
            background-size: cover;
            margin: 0;
            padding: 20px 10px 140px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* TAJUK UTAMA "PORTAL YEAR 3 BAHASA INGGERIS" */
        .header-title-container {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            z-index: 10;
            max-width: 900px;
        }

        .main-title {
            font-size: 36px;
            font-weight: 900;
            color: #0d3b66;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 
                3px 3px 0px #ffffff,
               -3px -3px 0px #ffffff,
                3px -3px 0px #ffffff,
               -3px 3px 0px #ffffff,
                0px 6px 12px rgba(0,0,0,0.3);
        }

        .sub-title-header {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* 3 BUIH KACA PEMBELAJARAN (3 GLASS BUBBLES ATAS) */
        .bubbles-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 850px;
            margin-bottom: 35px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
        }

        .step-bubble {
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95), rgba(186, 230, 253, 0.85));
            border: 4px solid #ffffff;
            box-shadow: 0 10px 20px rgba(0, 50, 100, 0.3), inset -4px -4px 8px rgba(2, 132, 199, 0.25);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px;
            transition: transform 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .step-bubble:hover {
            transform: scale(1.05);
        }

        .step-bubble .icon {
            font-size: 34px;
            margin-bottom: 2px;
        }

        .step-bubble .text {
            font-size: 14px;
            font-weight: 800;
            color: #0f3854;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .arrow-connect {
            width: 45px;
            height: 25px;
        }

        /* DOLPHIN SVGs */
        .dolphin-svg {
            position: absolute;
            z-index: 12;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
            pointer-events: none;
        }

        .dolphin-top-right {
            top: 70px;
            right: 5%;

            transform: rotate(-10deg);

            top: 260px;
            right: 2%;

        /* STRUKTUR BATU BATAN UTAMA (STONE FORMATION) */

            background: linear-gradient(145deg, rgba(163, 153, 142, 0.95) 0%, rgba(128, 118, 107, 0.95) 50%, rgba(97, 87, 77, 0.95) 100%);
            border: 6px solid #473e35;
            border-radius: 36px;
            box-shadow: 
                inset 0 8px 0 rgba(255,255,255,0.25),

            width: 100%;

            padding: 35px 25px 25px 25px;

            z-index: 10;
            backdrop-filter: blur(4px);

        .rock-badge {
            background: linear-gradient(180deg, #b5aba0 0%, #8c8277 100%);

            border-radius: 20px;
            padding: 8px 22px;

            top: -26px;

            transform: translateX(-50%);

        .rock-badge h2 {

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function bukaModulLain(url) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;

        if (!nama || !kelas) {
            alert("Please enter your name and select a class first!");
            return;
        }

        localStorage.setItem('pelajar_aktif', JSON.stringify({ nama, kelas }));
        window.location.href = url;
    }

    function bukaDashboardGuru() {
        const inputLaluan = prompt("🔑 Please enter Teacher's password:");
        if (inputLaluan === "guru123" || inputLaluan === "1234") {
            try { sessionStorage.setItem("guru_authenticated", "true"); } catch(e){}
            window.location.href = "dashboard.html";
        } else if (inputLaluan !== null) {
            alert("❌ Incorrect password!");
        }
    }

    function keHalamanUtama() {
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Please enter your name, select a class, and select a topic first!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("quizBank data not found!");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';

        const kunciPadan = modulKeys.find(key => {
            const matchKey = key.match(/\d+/);
            return (matchKey ? matchKey[0] : '') === nomborModul;
        });

        if (!kunciPadan) {
            alert(`Question data for ${modulInput} not found.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};
        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;
            htmlContent += `<div class="item-soalan">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `<div style="text-align:center; margin-bottom:12px;"><img src="${imgStr}" style="max-width:100%; height:auto; border-radius:10px;"></div>`;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');
            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="jawapanPengguna[${index}]='${pilihan}'">
                        <span style="margin-left: 12px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`You have only answered ${dijawab} out of ${jumlahSoalan} questions. Submit anyway?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) markah++;
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('en-GB')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #0f172a; font-size: 28px;">🎉 Quiz Results</h2>
            <div style="background: #ffffff; padding: 20px; border-radius: 16px; text-align: left; margin: 15px 0; border: 2px solid #bae6fd;">
                <p><strong>👤 Name:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>🏫 Class:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>📚 Topic:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 30px; color: #16a34a; margin: 15px 0;">Score: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="padding: 12px 24px;">🏠 Main Menu (HOME)</button>
        `;
    }
</script>

</body>
</html>
