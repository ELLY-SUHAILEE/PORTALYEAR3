<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kuiz Bahasa Inggeris Year 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Muat naik data soalan dari module1.js -->
    <script src="module1.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="min-h-screen py-6 px-3 sm:px-6 flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="max-w-4xl mx-auto w-full bg-white rounded-2xl shadow-md p-4 mb-4">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-3 rounded-xl shadow">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">PORTAL KUIZ YEAR 3</h1>
                    <p class="text-xs text-gray-500">English Module 1: Welcome!</p>
                </div>
            </div>

            <!-- Set Selector -->
            <div class="flex items-center gap-2 bg-gray-100 p-1.5 rounded-xl w-full md:w-auto">
                <button id="btn-getsmart" onclick="switchSet('GET SMART SET')" class="flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm">
                    GET SMART SET
                </button>
                <button id="btn-remedial" onclick="switchSet('REMEDIAL SET')" class="flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600">
                    REMEDIAL SET
                </button>
            </div>
        </div>
    </header>

    <!-- Sticky Score & Category Bar -->
    <div class="sticky top-2 z-20 max-w-4xl mx-auto w-full bg-slate-900/90 backdrop-blur-md text-white rounded-2xl shadow-xl p-4 mb-6 border border-slate-700/50">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-4 w-full sm:w-auto justify-between">
                <div>
                    <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">Jumlah Soalan</span>
                    <span id="answered-count" class="text-base font-semibold text-indigo-300">0 / 30 Dijawab</span>
                </div>
                <div class="h-8 w-px bg-slate-700 hidden sm:block"></div>
                <div>
                    <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">Markah Semasa</span>
                    <span id="score-text" class="text-lg font-extrabold text-emerald-400">0 / 30</span>
                </div>
            </div>

            <!-- Quick Category Nav Buttons -->
            <div class="flex flex-wrap gap-1.5 justify-center sm:justify-end text-xs w-full sm:w-auto">
                <button onclick="scrollToCategory('cat-Reading')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">📖 Reading</button>
                <button onclick="scrollToCategory('cat-Vocabulary')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">🔤 Vocabulary</button>
                <button onclick="scrollToCategory('cat-Grammar')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">⚖️ Grammar</button>
                <button onclick="scrollToCategory('cat-Writing')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">✏️ Writing</button>
                <button onclick="scrollToCategory('cat-Speaking')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">🗣️ Speaking</button>
                <button onclick="scrollToCategory('cat-Mixed Skills')" class="px-2.5 py-1 rounded-lg bg-indigo-800/60 hover:bg-indigo-600 text-indigo-100 transition">🧩 Mixed</button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- Main Quiz Scrollable Container -->
    <main id="quiz-container" class="max-w-4xl mx-auto w-full space-y-8 mb-8">
        <!-- Soalan-soalan akan dijana secara berterusan di sini -->
    </main>

    <!-- Bottom Finish / Summary Card -->
    <div id="summary-card" class="max-w-4xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-gray-100 p-8 text-center mb-8 hidden">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full text-3xl mb-4">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Kuiz Selesai!</h2>
        <p class="text-gray-600 mb-4">Anda telah menjawab kesemua soalan dalam set ini.</p>
        <div class="text-3xl font-black text-indigo-600 mb-6">
            Keputusan: <span id="final-score">0</span> / <span id="total-questions">30</span>
        </div>
        <button onclick="resetQuiz()" class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition inline-flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> Jawab Semula Set Ini
        </button>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 py-4">
        Portal Kuiz Interaktif Bahasa Inggeris Tahun 3 &bull; Module 1
    </footer>

    <script>
        let currentSet = "GET SMART SET";
        let aggregatedCategories = {};
        let totalQuestionsCount = 0;
        let score = 0;
        let answeredQuestionsCount = 0;
        let userAnswers = {};

        function initQuiz() {
            if (typeof quizBank === 'undefined' || !quizBank[currentSet]) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-bold">Ralat: Data kuiz tidak dijumpai dalam module1.js!</p>
                        <p class="text-xs mt-1">Sila pastikan fail module1.js dimuatkan dengan betul.</p>
                    </div>`;
                return;
            }

            aggregatedCategories = quizBank[currentSet]["Module 1: Welcome!"];
            score = 0;
            answeredQuestionsCount = 0;
            userAnswers = {};
            totalQuestionsCount = 0;

            // Hitung jumlah keseluruhan soalan
            for (let cat in aggregatedCategories) {
                totalQuestionsCount += aggregatedCategories[cat].length;
            }

            updateDashboard();
            renderAllQuestions();
            document.getElementById('summary-card').classList.add('hidden');
        }

        function switchSet(setName) {
            currentSet = setName;
            
            const btnGetSmart = document.getElementById('btn-getsmart');
            const btnRemedial = document.getElementById('btn-remedial');

            if (setName === 'GET SMART SET') {
                btnGetSmart.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm";
                btnRemedial.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600";
            } else {
                btnRemedial.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm";
                btnGetSmart.className = "flex-1 md:flex-none px-4 py-2 text-xs font-semibold rounded-lg transition-all text-gray-600 hover:text-indigo-600";
            }

            initQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateDashboard() {
            document.getElementById('score-text').innerText = `${score} / ${totalQuestionsCount}`;
            document.getElementById('answered-count').innerText = `${answeredQuestionsCount} / ${totalQuestionsCount} Dijawab`;
            
            const progressPercent = totalQuestionsCount > 0 ? (answeredQuestionsCount / totalQuestionsCount) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            if (answeredQuestionsCount === totalQuestionsCount && totalQuestionsCount > 0) {
                document.getElementById('summary-card').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                document.getElementById('total-questions').innerText = totalQuestionsCount;
            }
        }

        function renderAllQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            let globalQuestionIndex = 0;

            for (let category in aggregatedCategories) {
                const questionsList = aggregatedCategories[category];

                // Buat Header Kategori
                const categoryHeader = document.createElement('div');
                categoryHeader.id = `cat-${category}`;
                categoryHeader.className = "pt-4 pb-2 border-b-2 border-indigo-200 flex items-center justify-between";
                categoryHeader.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
                        <span class="w-3 h-3 bg-indigo-600 rounded-full inline-block"></span>
                        Bahagian: ${category}
                    </h2>
                    <span class="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full">
                        ${questionsList.length} Soalan
                    </span>
                `;
                container.appendChild(categoryHeader);

                // Buat Setiap Kad Soalan
                questionsList.forEach((q) => {
                    const qIndex = globalQuestionIndex;
                    globalQuestionIndex++;

                    const card = document.createElement('div');
                    card.id = `q-card-${qIndex}`;
                    card.className = "bg-white rounded-3xl shadow-md border border-slate-100 p-6 md:p-8 space-y-5 transition-all";

                    // GAMBAR DIBESARKAN (Lebih jelas untuk petikan & grafik)
                    let imageHTML = '';
                    if (q.image && q.image.trim() !== '') {
                        imageHTML = `
                            <div class="text-center my-3 bg-slate-50 p-3 sm:p-4 rounded-2xl border border-slate-200">
                                <span class="text-xs font-semibold text-slate-400 block mb-2"><i class="fa-solid fa-image"></i> Petikan / Gambar Soalan</span>
                                <img src="${q.image}" 
                                     alt="Gambar Soalan" 
                                     onerror="this.onerror=null; this.src='https://placehold.co/600x300/e2e8f0/475569?text=Gambar+Dalam+Folder+images/';"
                                     class="max-w-full sm:max-w-xl md:max-w-2xl max-h-[380px] md:max-h-[450px] mx-auto object-contain rounded-xl shadow-sm border border-slate-200">
                            </div>
                        `;
                    }

                    // Pilihan Jawapan HTML
                    let optionsHTML = '<div class="grid grid-cols-1 gap-3 mt-4" id="options-container-' + qIndex + '">';
                    q.options.forEach((opt) => {
                        optionsHTML += `
                            <button id="opt-btn-${qIndex}-${escapeId(opt)}" 
                                    onclick="selectOption(${qIndex}, '${escapeQuote(opt)}', '${escapeQuote(q.ans)}')" 
                                    class="w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition font-medium text-slate-700 flex justify-between items-center text-sm md:text-base">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle text-slate-300"></i>
                            </button>
                        `;
                    });
                    optionsHTML += '</div>';

                    card.innerHTML = `
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs font-bold px-3 py-1 bg-slate-100 text-slate-600 rounded-full">
                                Soalan ${qIndex + 1}
                            </span>
                            <span id="badge-status-${qIndex}" class="text-xs font-semibold text-slate-400">
                                Belum Dijawab
                            </span>
                        </div>

                        ${imageHTML}

                        <div class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">
                            <p class="text-base sm:text-lg font-bold text-slate-800 whitespace-pre-line leading-relaxed">${q.q}</p>
                        </div>

                        ${optionsHTML}

                        <div id="feedback-${qIndex}" class="hidden p-4 rounded-2xl text-sm font-semibold text-center transition-all"></div>
                    `;

                    container.appendChild(card);
                });
            }
        }

        function selectOption(qIndex, selectedOpt, correctAns) {
            if (userAnswers[qIndex]) return; // Elak jawapan diubah semula

            const isCorrect = (selectedOpt === correctAns);
            
            userAnswers[qIndex] = {
                selected: selectedOpt,
                correct: isCorrect
            };

            if (isCorrect) {
                score += 1;
            }
            answeredQuestionsCount += 1;

            // Kemas kini gaya pilihan jawapan bagi soalan ini
            const optionsContainer = document.getElementById(`options-container-${qIndex}`);
            const buttons = optionsContainer.getElementsByTagName('button');

            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed');

                // Dapatkan teks jawapan butang ini
                const btnText = btn.querySelector('span').innerText;

                if (btnText === correctAns) {
                    btn.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold flex justify-between items-center text-sm md:text-base";
                    btn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-600 text-lg";
                } else if (btnText === selectedOpt && !isCorrect) {
                    btn.className = "w-full text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-medium flex justify-between items-center text-sm md:text-base";
                    btn.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-500 text-lg";
                } else {
                    btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 text-slate-400 opacity-60 flex justify-between items-center text-sm md:text-base";
                }
            }

            // Kemas kini Kotak Maklum Balas
            const feedbackBox = document.getElementById(`feedback-${qIndex}`);
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                feedbackBox.className = "p-4 rounded-2xl text-sm font-semibold text-center bg-emerald-100 text-emerald-800 border border-emerald-200";
                feedbackBox.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Syabas! Jawapan anda TEPAT.';
            } else {
                feedbackBox.className = "p-4 rounded-2xl text-sm font-semibold text-center bg-rose-100 text-rose-800 border border-rose-200";
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Maaf, jawapan tidak tepat. Jawapan betul: <b>${correctAns}</b>`;
            }

            // Status Kad Soalan
            const badgeStatus = document.getElementById(`badge-status-${qIndex}`);
            badgeStatus.className = isCorrect ? "text-xs font-bold text-emerald-600" : "text-xs font-bold text-rose-600";
            badgeStatus.innerText = isCorrect ? "Betul ✓" : "Salah ✗";

            updateDashboard();
        }

        function scrollToCategory(catId) {
            const elem = document.getElementById(catId);
            if (elem) {
                const offset = 100; // Ruang untuk sticky navbar
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = elem.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        function resetQuiz() {
            initQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Helper functions
        function escapeQuote(str) {
            return str.replace(/'/g, "\\'");
        }

        function escapeId(str) {
            return str.replace(/[^a-zA-Z0-9]/g, '_');
        }

        // Mula kuiz bila tetingkap dimuatkan
        window.onload = initQuiz;
    </script>
</body>
</html>
