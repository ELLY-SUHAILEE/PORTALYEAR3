<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kuiz Tahun 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f9ff;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 2px solid #e2e8f0;
        }

        h1, h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #0284c7;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-teacher {
            background-color: #8b5cf6;
            color: white;
        }

        .btn-teacher:hover {
            background-color: #7c3aed;
        }

        .btn-submit {
            background-color: #16a34a;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-home {
            background-color: #0284c7;
            color: white;
            margin-top: 15px;
        }

        .item-soalan {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .pilihan-jawapan label {
            display: flex;
            align-items: center;
            background: white;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: normal;
        }

        .pilihan-jawapan label:hover {
            background: #f1f5f9;
        }

        .pilihan-jawapan input[type="radio"] {
            width: 18px;
            height: 18px;
        }

        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BORANG MULA -->
        <div id="borang-mula">
            <h1>📚 Portal Kuiz Tahun 3</h1>
            
            <div class="form-group">
                <label for="nama">👤 Nama Pelajar:</label>
                <input type="text" id="nama" placeholder="Masukkan nama penuh anda...">
            </div>

            <div class="form-group">
                <label for="kelas">🏫 Kelas:</label>
                <select id="kelas">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="3 Cemerlang">3 Cemerlang</option>
                    <option value="3 Gemilang">3 Gemilang</option>
                    <option value="3 Terbilang">3 Terbilang</option>
                </select>
            </div>

            <div class="form-group">
                <label for="modul">📚 Modul / Topik:</label>
                <select id="modul">
                    <option value="">-- Pilih Modul --</option>
                    <option value="Modul 1">Modul 1</option>
                    <option value="Modul 2">Modul 2</option>
                    <option value="Modul 3">Modul 3</option>
                    <option value="Modul 4">Modul 4</option>
                    <option value="Modul 5">Modul 5</option>
                    <option value="Modul 6">Modul 6</option>
                    <option value="Modul 7">Modul 7</option>
                    <option value="Modul 8">Modul 8</option>
                    <option value="Modul 9">Modul 9</option>
                    <option value="Modul 10">Modul 10</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="mulaKuiz('Set A')">🎮 Mula Set A</button>
                <button class="btn-secondary" onclick="mulaKuiz('Set B')">🎮 Mula Set B</button>
                <button class="btn-teacher" onclick="bukaDashboardGuru()">🔑 Dashboard Guru</button>
            </div>
        </div>

        <!-- PAPAN KUIZ -->
        <div id="papan-kuiz">
            <h2>📝 Kuiz: <span id="label-modul-papar"></span></h2>
            <div id="bekas-senarai-soalan"></div>
            <button id="btn-submit" class="btn-submit" onclick="hantarKuiz()">🚀 SUBMIT</button>
        </div>

        <!-- KEPUTUSAN KUIZ -->
        <div id="keputusan-kuiz"></div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="module1.js"></script>
    <script src="module2.js"></script>
    <script src="module3.js"></script>
    <script src="module4.js"></script>
    <script src="module5.js"></script>
    <script src="module6.js"></script>
    <script src="module7.js"></script>
    <script src="module8.js"></script>
    <script src="module9.js"></script>
    <script src="module10.js"></script>

    <script>
        // PAUTAN WEB APP GOOGLE APPS SCRIPT ANDA
        const webAppUrl = "https://script.google.com/macros/s/AKfycbw7kBkxXYQ7YkANp6QuxcEzBIeGbvySJ2_enh2zB21zOuGDk9hULjWc_n8xJq4SV2sE/exec";

        let soalanSemasa = [];
        let jawapanPengguna = {};
        let maklumatPelajar = {};

        function bukaModulLain(url) {
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;

            if (!nama || !kelas) {
                alert("Please enter your name and select a class first!");
                return;
            }

            localStorage.setItem('pelajar_aktif', JSON.stringify({ nama, kelas }));
            window.location.href = url;
        }

        function bukaDashboardGuru() {
            const inputLaluan = prompt("🔑 Please enter Teacher's password:");
            if (inputLaluan === "guru123" || inputLaluan === "1234") {
                try { sessionStorage.setItem("guru_authenticated", "true"); } catch(e){}
                window.location.href = "dashboard.html";
            } else if (inputLaluan !== null) {
                alert("❌ Incorrect password!");
            }
        }

        function keHalamanUtama() {
            document.getElementById('borang-mula').style.display = 'block';
            document.getElementById('papan-kuiz').style.display = 'none';
            document.getElementById('keputusan-kuiz').style.display = 'none';
        }

        function mulaKuiz(setTerpilih) {
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value;
            const modulInput = document.getElementById('modul').value;

            if (!nama || !kelas || !modulInput) {
                alert("Please enter your name, select a class, and select a topic first!");
                return;
            }

            if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
                alert("quizBank data not found!");
                return;
            }

            const modulKeys = Object.keys(quizBank[setTerpilih]);
            const matchNombor = modulInput.match(/\d+/);
            const nomborModul = matchNombor ? matchNombor[0] : '';

            const kunciPadan = modulKeys.find(key => {
                const matchKey = key.match(/\d+/);
                return (matchKey ? matchKey[0] : '') === nomborModul;
            });

            if (!kunciPadan) {
                alert(`Question data for ${modulInput} not found.`);
                return;
            }

            const dataModul = quizBank[setTerpilih][kunciPadan];
            maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
            soalanSemasa = [];

            Object.keys(dataModul).forEach(kategori => {
                soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
            });

            jawapanPengguna = {};
            document.getElementById('borang-mula').style.display = 'none';
            document.getElementById('papan-kuiz').style.display = 'block';
            document.getElementById('keputusan-kuiz').style.display = 'none';

            paparSemuaSoalan();
        }

        function paparSemuaSoalan() {
            document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
            const bekas = document.getElementById('bekas-senarai-soalan');
            let htmlContent = '';

            soalanSemasa.forEach((soalan, index) => {
                const nomborSoalan = index + 1;
                htmlContent += `<div class="item-soalan">`;
                
                if (soalan.image) {
                    const imgStr = String(soalan.image).trim();
                    if (imgStr.startsWith('<')) {
                        htmlContent += imgStr;
                    } else {
                        htmlContent += `<div style="text-align:center; margin-bottom:12px;"><img src="${imgStr}" style="max-width:100%; height:auto; border-radius:10px;"></div>`;
                    }
                }

                const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');
                htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
                htmlContent += `<div class="pilihan-jawapan" style="margin-top: 10px;">`;

                soalan.options.forEach((pilihan) => {
                    htmlContent += `
                        <label>
                            <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="jawapanPengguna[${index}]='${pilihan}'">
                            <span style="margin-left: 10px;">${pilihan}</span>
                        </label>
                    `;
                });

                htmlContent += `</div></div>`;
            });

            bekas.innerHTML = htmlContent;
        }

        async function hantarKuiz() {
            const jumlahSoalan = soalanSemasa.length;
            const dijawab = Object.keys(jawapanPengguna).length;

            if (dijawab < jumlahSoalan) {
                if (!confirm(`You have only answered ${dijawab} out of ${jumlahSoalan} questions. Submit anyway?`)) {
                    return;
                }
            }

            // Kunci butang submit untuk elak double-click
            const btnSubmit = document.getElementById('btn-submit');
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerText = "⏳ SUBMITTING...";
            }

            let markah = 0;
            soalanSemasa.forEach((soalan, idx) => {
                if (jawapanPengguna[idx] === soalan.ans) markah++;
            });

            const peratus = Math.round((markah / jumlahSoalan) * 100);

            // 1. Simpan rekod tempatan (localStorage)
            let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
            senaraiRekod.push({
                nama: maklumatPelajar.nama,
                kelas: maklumatPelajar.kelas,
                modul: maklumatPelajar.modul,
                set: maklumatPelajar.set,
                markah: peratus,
                tarikh: new Date().toLocaleDateString('en-GB')
            });
            localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

            // 2. HANTAR DATA KE GOOGLE SHEET VIA GOOGLE APPS SCRIPT (FORMAT DIBAIKI)
            const payload = {
                name: maklumatPelajar.nama,
                class: maklumatPelajar.kelas,
                category: maklumatPelajar.set,
                module: maklumatPelajar.modul,
                score: `${markah}/${jumlahSoalan}`,
                percent: `${peratus}%`
            };

            try {
                await fetch(webAppUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, // ✅ Dibaiki: Mengelakkan CORS Preflight Error
                    body: JSON.stringify(payload)
                });
                console.log("Data berjaya dihantar ke Google Sheet!");
            } catch (err) {
                console.error("Ralat penghantaran data:", err);
            }

            // 3. Paparkan Keputusan Kuiz kepada Murid
            document.getElementById('papan-kuiz').style.display = 'none';
            const bekasKeputusan = document.getElementById('keputusan-kuiz');
            bekasKeputusan.style.display = 'block';
            
            bekasKeputusan.innerHTML = `
                <h2 style="color: #0f172a; font-size: 26px;">🎉 Quiz Results</h2>
                <div style="background: #ffffff; padding: 18px; border-radius: 14px; text-align: left; margin: 16px 0; border: 3px solid #bae6fd; font-size: 20px;">
                    <p style="margin-bottom: 8px;"><strong>👤 Name:</strong> ${maklumatPelajar.nama}</p>
                    <p style="margin-bottom: 8px;"><strong>🏫 Class:</strong> ${maklumatPelajar.kelas}</p>
                    <p style="margin-bottom: 8px;"><strong>📚 Topic:</strong> ${maklumatPelajar.modul}</p>
                    <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
                </div>
                <h3 style="font-size: 28px; color: #16a34a; margin: 16px 0;">Score: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
                <button class="btn-home" onclick="keHalamanUtama()" style="padding: 12px 24px;">🏠 Main Menu (HOME)</button>
            `;

            // Reset butang
            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "🚀 SUBMIT";
            }
        }
    </script>
</body>
</html>
