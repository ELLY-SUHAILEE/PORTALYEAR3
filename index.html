<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Forest English Quest 🌲</title>
    <!-- Font Mesra Kanak-Kanak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Hutan, Kabin & Gunung-Ganang */
        body {
            background: linear-gradient(180deg, rgba(20, 50, 32, 0.75) 0%, rgba(10, 30, 18, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1511497584788-8767610419ea?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN & ELEMENT HUTAN / KABIN / GUNUNG */
        .forest-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .creature-bird {
            top: 6%;
            width: 220px;
            height: auto;
            animation: flyRight 22s infinite linear;
            opacity: 0.9;
        }

        .creature-owl {
            top: 10%;
            right: 4%;
            width: 130px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            opacity: 0.95;
        }

        .creature-butterfly1 {
            top: 38%;
            left: 3%;
            width: 100px;
            height: auto;
            animation: flutter 9s infinite ease-in-out;
        }

        .creature-butterfly2 {
            top: 52%;
            right: 4%;
            width: 90px;
            height: auto;
            animation: flutter 11s infinite ease-in-out;
            animation-delay: 2s;
        }

        /* Kabin & Gunung Hutan (Bahagian Bawah Kiri) */
        .creature-cabin {
            bottom: 10px;
            left: 2%;
            width: 220px;
            height: auto;
            animation: pulseGlow 5s infinite alternate;
        }

        /* Cendawan Hutan (Bahagian Bawah Kanan) */
        .creature-mushroom {
            bottom: 10px;
            right: 3%;
            width: 130px;
            height: auto;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes flyRight {
            0% { transform: translateX(-30vw) translateY(0px) scale(0.9); }
            50% { transform: translateX(45vw) translateY(-20px) scale(1.1); }
            100% { transform: translateX(115vw) translateY(10px) scale(0.9); }
        }

        @keyframes flutter {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(-8deg) scale(1.05); }
            75% { transform: translateY(15px) rotate(8deg) scale(0.95); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(-4deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 10px 20px rgba(255, 237, 213, 0.3)); }
        }

        body::before, body::after {
            content: "🍃";
            position: fixed;
            font-size: 2rem;
            opacity: 0.4;
            animation: leafFall 10s infinite linear;
            z-index: 0;
        }
        body::before { left: 18%; animation-duration: 11s; }
        body::after { right: 25%; animation-duration: 8s; animation-delay: 3s; }

        @keyframes leafFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(80px); opacity: 0; }
        }

        /* Kad Utama Glassmorphism Tema Hijau Cair & Oren Cair */
        .card {
            background: rgba(245, 253, 248, 0.93);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa; /* Frame Oren Cair */
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #166534;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 34px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #fed7aa; /* Bayangan Oren Cair */
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        /* TULISAN PAPARAN UTAMA (LABEL, INPUT, SELECT) - SAIZ 20px */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #166534;
            font-size: 20px !important;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #86efac; /* Hijau Cair */
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #f0fdf4; /* Soft Mint */
            color: #052e16;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        input[type="text"]:focus, select:focus {
            border-color: #fb923c; /* Focus Oren Cair */
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(253, 186, 116, 0.4);
        }

        .sub-title {
            text-align: center;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #c2410c; /* Oren gelap sedikit untuk kontras */
            font-size: 20px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn-set {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 20px !important;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        /* GET SMART SET: Tona Hijau Cair */
        .btn-blue {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 6px 0px #15803d;
        }
        .btn-blue:hover { background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); }

        /* REMEDIAL SET: Tona Oren Cair */
        .btn-green {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            box-shadow: 0 6px 0px #c2410c;
        }
        .btn-green:hover { background: linear-gradient(135deg, #fdba74 0%, #fb923c 100%); }

        .btn-home {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            color: #052e16;
            padding: 12px 22px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0px #16a34a;
            transition: all 0.15s ease;
        }
        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #16a34a;
        }

        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }

        /* Item Soalan & Kad Jawapan (Hijau Cair & Oren Cair) */
        .item-soalan {
            background-color: #ffffff;
            border: 3px solid #bbf7d0; /* Sisi Hijau Cair */
            border-left: 8px solid #fb923c; /* Jalur Akses Oren Cair */
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(22, 101, 52, 0.06);
        }

        /* TULISAN SOALAN - SAIZ 20px */
        .item-soalan h3 {
            font-size: 20px !important;
            color: #052e16;
            line-height: 1.5;
            font-weight: 700;
        }

        /* TULISAN PILIHAN JAWAPAN - SAIZ 20px */
        .pilihan-jawapan label {
            font-weight: 600;
            background: #f0fdf4; /* Hijau cair */
            padding: 16px 20px;
            border: 2px solid #dcfce7;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #166534;
            font-size: 20px !important;
        }

        .pilihan-jawapan label:hover {
            background-color: #ffedd5; /* Pertukaran ke Oren cair apabila tetikus lalu */
            border-color: #fed7aa;
            transform: translateX(4px);
        }

        .pilihan-jawapan input[type="radio"] {
            accent-color: #f97316; /* Warna radio button Oren */
            width: 22px;
            height: 22px;
        }

        .question-image-container {
            text-align: center;
            margin-bottom: 18px;
            background-color: #fff7ed; /* Oren sangat cair */
            padding: 12px;
            border: 2px dashed #fb923c;
            border-radius: 16px;
        }

        .question-image, .item-soalan img {
            width: 100% !important;
            max-width: 680px !important;
            height: auto !important;
            max-height: 500px !important;
            border-radius: 12px;
            object-fit: contain !important;
        }

        .item-soalan.img-small img,
        .question-image-container.img-small img {
            max-width: 320px !important;
            max-height: 220px !important;
            margin: 0 auto;
            display: block;
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #166534;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .link-guru:hover {
            background: #ffedd5;
            color: #c2410c;
        }
    </style>
</head>

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function bukaDashboardGuru() {
        const inputLaluan = prompt("🔑 Sila masukkan kata laluan Guru:");

        // Menerima kata laluan guru123 atau 1234
        if (inputLaluan === "guru123" || inputLaluan === "1234") {
            try {
                sessionStorage.setItem("guru_authenticated", "true");
            } catch(e) {
                console.log("sessionStorage disekat pelayar.");
            }
            window.location.href = "dashboard.html";
        } else if (inputLaluan !== null) {
            alert("❌ Kata laluan salah! Akses ditolak.");
        }
    }

    function keHalamanUtama() {
        if (document.getElementById('papan-kuiz').style.display === 'block') {
            if (!confirm("Adakah anda pasti mahu kembali ke Utama? Jawapan semasa tidak akan disimpan.")) {
                return;
            }
        }
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Sila isi nama, pilih kelas, dan pilih modul terlebih dahulu!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("Data quizBank tidak dijumpai! Pastikan fail JS modul dimuatkan.");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';
        const kunciPadan = modulKeys.find(key => {
            const keyLower = key.toLowerCase();
            const inputLower = modulInput.toLowerCase();
            return keyLower.startsWith(inputLower) || 
                   keyLower.includes(`module ${nomborModul}`) || 
                   keyLower.includes(`module${nomborModul}`);
        });

        if (!kunciPadan) {
            alert(`Data soalan untuk ${modulInput} (${setTerpilih}) tidak dijumpai. Sila pastikan fail module*.js mengandungi data bagi modul ini.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};

        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;
            const isSmallImg = (nomborSoalan >= 11 && nomborSoalan <= 30);
            const extraClass = isSmallImg ? 'img-small' : '';

            htmlContent += `<div class="item-soalan ${extraClass}">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `
                        <div class="question-image-container ${extraClass}">
                            <img src="${imgStr}" alt="Soalan ${nomborSoalan}" class="question-image" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:red;font-size:16px;\\'>[Gambar gagal dimuatkan: ${imgStr}]</span>';">
                        </div>
                    `;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');

            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="pilihJawapan(${index}, '${pilihan}')">
                        <span style="margin-left: 14px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function pilihJawapan(index, pilihan) {
        jawapanPengguna[index] = pilihan;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`Anda hanya menjawab ${dijawab} daripada ${jumlahSoalan} soalan. Adakah anda pasti ingin menghantar?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) {
                markah++;
            }
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('ms-MY')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #166534; font-size: 30px;">🎉 Keputusan Kuiz</h2>
            <div style="background: #f0fdf4; padding: 22px; border-radius: 18px; text-align: left; margin: 20px 0; border: 2px solid #fed7aa; font-size: 20px;">
                <p><strong>👤 Nama:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>🏫 Kelas:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>📚 Modul:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 32px; color: #f97316; margin: 15px 0;">⭐ Markah: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="margin-top: 15px; padding: 14px 28px; font-size: 20px;">🏠 Halaman Utama (HOME)</button>
        `;
    }
</script>

</body>
</html>
