<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL YEAR 3 - ENGLISH QUIZ</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; --card-bg: #ffffff; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: var(--primary); }
    .hidden { display: none; }
    .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .set-card { background: #e0e7ff; border: 2px solid var(--primary); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
    .set-card:hover { background: var(--primary); color: white; transform: translateY(-3px); }
    .set-card h2 { color: inherit; margin: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:hover { opacity: 0.9; }
    .question-card { background: #f9fafb; border: 1px solid #e5e7eb; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .question-card img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
    .options-list { list-style: none; padding: 0; }
    .options-list label { cursor: pointer; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; display: block; margin-bottom: 8px; }
    .options-list input { width: auto; margin-right: 10px; }
    .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .nav-btn { width: auto; padding: 6px 15px; font-size: 14px; background: #6b7280; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <button class="nav-btn" onclick="goHome()">🏠 Halaman Utama</button>
    <button class="nav-btn" style="background:#059669;" onclick="showAdmin()">🔐 Rekod Guru</button>
  </div>

  <!-- VIEW 1: Pilih Set -->
  <div id="view-set">
    <h1>🎯 PORTAL YEAR 3 ENGLISH</h1>
    <p style="text-align: center;">Sila pilih set latihan anda:</p>
    <div class="set-grid">
      <div class="set-card" onclick="selectSet('GET SMART SET')">
        <h2>GET SMART SET</h2>
        <p>Latihan Aras Standard / Pengukuhan</p>
      </div>
      <div class="set-card" onclick="selectSet('REMEDIAL SET')">
        <h2>REMEDIAL SET</h2>
        <p>Latihan Aras Asas / Pemulihan</p>
      </div>
    </div>
  </div>

  <!-- VIEW 2: Maklumat Murid & Pilih Modul -->
  <div id="view-student-info" class="hidden">
    <h2 id="selected-set-title"></h2>
    <div class="form-group">
      <label>Nama Murid:</label>
      <input type="text" id="student-name" placeholder="Contoh: Danial Bin Ahmad">
    </div>
    <div class="form-group">
      <label>Kelas:</label>
      <input type="text" id="student-class" placeholder="Contoh: 3 Cemerlang">
    </div>
    <div class="form-group">
      <label>Pilih Topik / Modul:</label>
      <select id="select-module">
        <option value="">-- Sila Pilih Topik --</option>
      </select>
    </div>
    <button onclick="startQuiz()">Mula Jawab Kuiz 🚀</button>
  </div>

  <!-- VIEW 3: Soalan -->
  <div id="view-quiz" class="hidden">
    <h2 id="quiz-module-title"></h2>
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="button" onclick="submitQuiz()">Hantar & Semak Keputusan 📝</button>
    </form>
  </div>

  <!-- VIEW 4: Keputusan -->
  <div id="view-result" class="hidden">
    <h2>🎉 Tahniah! Anda telah selesai.</h2>
    <h1 style="text-align: center; color: var(--primary);" id="score-display"></h1>
    <p style="text-align: center;" id="result-detail"></p>
    <button onclick="goHome()">Jawab Modul Lain 🔄</button>
  </div>

  <!-- VIEW 5: Rekod Guru -->
  <div id="view-admin" class="hidden">
    <h2>🔐 Rekod Keputusan Murid (Guru)</h2>
    <div id="admin-login">
      <input type="password" id="admin-pin" placeholder="Masukkan PIN (1234)">
      <button onclick="checkPin()">Log Masuk</button>
    </div>
    <div id="admin-content" class="hidden">
      <button onclick="downloadCSV()" style="background:#10b981; margin-bottom: 10px;">📥 Muat Turun CSV</button>
      <table border="1" style="width:100%; border-collapse:collapse;" id="records-table">
        <thead><tr style="background:#e0e7ff;"><th>Masa</th><th>Nama</th><th>Kelas</th><th>Set</th><th>Modul</th><th>Markah</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// BANK SOALAN DISATUKAN DI SINI
const quizBank = {
  "GET SMART SET": {
    "Module 1: Welcome!": {
      "Reading": [
        { type: "mcq", q: "Read the text:\n'Hi, I'm Anna. I'm ten years old. I have got brown hair and green eyes. I can play the piano.'\n\nHow old is Anna?", options: ["Eight years old", "Ten years old", "Twelve years old"], ans: "Ten years old" },
        { type: "tf", q: "Based on the text: Anna has got blonde hair.", options: ["True", "False"], ans: "False" }
      ],
      "Writing": [
        { type: "mcq", q: "Choose the correct sentence.", options: ["She have got straight hair.", "She has got straight hair."], ans: "She has got straight hair." }
      ],
      "Grammar": [
        { type: "mcq", q: "Tim _______ got curly hair.", options: ["has", "have"], ans: "has" }
      ]
    },
    "Module 2: Every day": {
      "Reading": [{ type: "mcq", q: "Where does a firefighter work?", options: ["Hospital", "Fire station"], ans: "Fire station" }]
    },
    "Module 3: Right now": {
      "Reading": [{ type: "mcq", q: "What is Mark doing?", options: ["Playing baseball", "Swimming"], ans: "Playing baseball" }]
    },
    "Module 4: Year in, year out": {
      "Grammar": [{ type: "mcq", q: "My favorite season _______ summer.", options: ["is", "are"], ans: "is" }]
    },
    "Module 5: My new house": {
      "Grammar": [{ type: "mcq", q: "Whose coat is this? It's _______.", options: ["mine", "my"], ans: "mine" }]
    },
    "Module 6: Food, food!": {
      "Reading": [{ type: "mcq", q: "What do you need to make an omelette?", options: ["Eggs, milk, cheese, butter", "Flour, sugar"], ans: "Eggs, milk, cheese, butter" }]
    },
    "Module 7: Out and about": {
      "Writing": [{ type: "mcq", q: "Choose the correct past tense sentence.", options: ["They bought two tickets yesterday.", "They buyed two tickets yesterday."], ans: "They bought two tickets yesterday." }]
    },
    "Module 8: Where were you yesterday?": {
      "Grammar": [{ type: "mcq", q: "Where _______ you yesterday afternoon?", options: ["were", "was"], ans: "were" }]
    },
    "Module 9: On holiday": {
      "Grammar": [{ type: "mcq", q: "They _______ camping on their holiday.", options: ["went", "go"], ans: "went" }]
    },
    "Module 10: The world around us": {
      "Grammar": [{ type: "mcq", q: "Mount Everest is the _______ mountain in the world.", options: ["highest", "higher"], ans: "highest" }]
    }
  },

  "REMEDIAL SET": {
    "Module 1: Welcome!": {
      "Reading": [{ type: "tf", q: "A cat has got two legs.", options: ["True", "False"], ans: "False" }],
      "Grammar": [{ type: "mcq", q: "I _______ swim.", options: ["can", "am"], ans: "can" }]
    },
    "Module 2: Every day": {
      "Reading": [{ type: "tf", q: "A chef works in a kitchen.", options: ["True", "False"], ans: "True" }]
    },
    "Module 3: Right now": {
      "Grammar": [{ type: "mcq", q: "They _______ dancing.", options: ["are", "is"], ans: "are" }]
    },
    "Module 4: Year in, year out": {
      "Reading": [{ type: "tf", q: "It is cold in winter.", options: ["True", "False"], ans: "True" }]
    },
    "Module 5: My new house": {
      "Grammar": [{ type: "mcq", q: "There _______ a lamp.", options: ["is", "are"], ans: "is" }]
    },
    "Module 6: Food, food!": {
      "Grammar": [{ type: "mcq", q: "There _______ some rice.", options: ["is", "are"], ans: "is" }]
    },
    "Module 7: Out and about": {
      "Grammar": [{ type: "mcq", q: "He _______ a book yesterday.", options: ["read", "reads"], ans: "read" }]
    },
    "Module 8: Where were you yesterday?": {
      "Grammar": [{ type: "mcq", q: "They _______ at school yesterday.", options: ["were", "was"], ans: "were" }]
    },
    "Module 9: On holiday": {
      "Grammar": [{ type: "mcq", q: "She _______ photos on her holiday.", options: ["took", "take"], ans: "took" }]
    },
    "Module 10: The world around us": {
      "Grammar": [{ type: "mcq", q: "A lion is _______ than a cat.", options: ["bigger", "biggest"], ans: "bigger" }]
    }
  }
};

  let currentSet = "", currentModule = "", activeQuestions = [];

  function hideAllViews() {
    ['view-set','view-student-info','view-quiz','view-result','view-admin'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
  }

  function goHome() {
    hideAllViews();
    document.getElementById('view-set').classList.remove('hidden');
  }

  function selectSet(setName) {
    currentSet = setName;
    hideAllViews();
    document.getElementById('view-student-info').classList.remove('hidden');
    document.getElementById('selected-set-title').innerText = setName;

    const moduleSelect = document.getElementById('select-module');
    moduleSelect.innerHTML = '<option value="">-- Sila Pilih Topik --</option>';
    
    if (quizBank[setName]) {
      Object.keys(quizBank[setName]).forEach(mod => {
        let opt = document.createElement('option');
        opt.value = mod;
        opt.innerText = mod;
        moduleSelect.appendChild(opt);
      });
    }
  }

  function startQuiz() {
    const name = document.getElementById('student-name').value.trim();
    const studentClass = document.getElementById('student-class').value.trim();
    currentModule = document.getElementById('select-module').value;

    if (!name || !studentClass) {
      alert("Sila masukkan Nama dan Kelas anda!");
      return;
    }

    if (!currentModule) {
      alert("Sila pilih Topik / Modul!");
      return;
    }

    activeQuestions = [];
    const targetModule = quizBank[currentSet][currentModule];

    if (Array.isArray(targetModule)) {
      activeQuestions = targetModule;
    } else if (typeof targetModule === 'object') {
      Object.keys(targetModule).forEach(skill => {
        if (Array.isArray(targetModule[skill])) {
          activeQuestions = activeQuestions.concat(targetModule[skill]);
        }
      });
    }

    const container = document.getElementById('questions-container');
    container.innerHTML = "";

    activeQuestions.forEach((q, idx) => {
      let qHtml = `<div class="question-card"><p><strong>Soalan ${idx + 1}:</strong> ${q.q.replace(/\n/g, '<br>')}</p>`;
      if(q.img) qHtml += `<img src="${q.img}">`;
      qHtml += `<ul class="options-list">`;
      q.options.forEach(opt => {
        qHtml += `<li><label><input type="radio" name="q_${idx}" value="${opt}"> ${opt}</label></li>`;
      });
      qHtml += `</ul></div>`;
      container.innerHTML += qHtml;
    });

    hideAllViews();
    document.getElementById('view-quiz').classList.remove('hidden');
    document.getElementById('quiz-module-title').innerText = `${currentSet} - ${currentModule}`;
  }

  function submitQuiz() {
    let score = 0;
    activeQuestions.forEach((q, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      if (selected && selected.value === q.ans) score++;
    });

    const total = activeQuestions.length;
    const percentage = Math.round((score / total) * 100);

    hideAllViews();
    document.getElementById('view-result').classList.remove('hidden');
    document.getElementById('score-display').innerText = `${score} / ${total} (${percentage}%)`;
    document.getElementById('result-detail').innerText = `Tahniah ${document.getElementById('student-name').value}!`;

    let localData = JSON.parse(localStorage.getItem('quizRecords') || '[]');
    localData.push({
      time: new Date().toLocaleString(),
      name: document.getElementById('student-name').value,
      class: document.getElementById('student-class').value,
      set: currentSet,
      module: currentModule,
      score: `${score}/${total}`
    });
    localStorage.setItem('quizRecords', JSON.stringify(localData));
  }

  function showAdmin() {
    hideAllViews();
    document.getElementById('view-admin').classList.remove('hidden');
  }

  function checkPin() {
    if (document.getElementById('admin-pin').value === "1234") {
      document.getElementById('admin-login').classList.add('hidden');
      document.getElementById('admin-content').classList.remove('hidden');
      const records = JSON.parse(localStorage.getItem('quizRecords') || '[]');
      const tbody = document.querySelector('#records-table tbody');
      tbody.innerHTML = records.map(r => `<tr><td>${r.time}</td><td>${r.name}</td><td>${r.class}</td><td>${r.set}</td><td>${r.module}</td><td>${r.score}</td></tr>`).join('');
    } else {
      alert("PIN Salah!");
    }
  }

  function downloadCSV() {
    const records = JSON.parse(localStorage.getItem('quizRecords') || '[]');
    let csv = "Masa,Nama,Kelas,Set,Modul,Markah\n" + records.map(r => `"${r.time}","${r.name}","${r.class}","${r.set}","${r.module}","${r.score}"`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Rekod_Kuiz.csv';
    a.click();
  }
</script>

</body>
</html>
