<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Ocean English Quest 🌊</title>
    <!-- Font Mesra Kanak-Kanak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Dasar Laut Bergelombang */
        body {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 40%, #0c4a6e 100%);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN DASAR LAUT REALISTIK (INLINE SVG) */
        .ocean-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* Paus Berenang Perlahan (Bersaiz Sangat Besar) */
        .creature-whale {
            top: 4%;
            width: 340px;
            height: auto;
            animation: swimRight 28s infinite linear;
            opacity: 0.85;
        }

        /* Ikan Badut / Clownfish */
        .creature-fish1 {
            top: 38%;
            width: 150px;
            height: auto;
            animation: swimLeft 14s infinite linear;
            animation-delay: 1s;
        }

        /* Penyu Laut Berenang */
        .creature-turtle {
            top: 60%;
            width: 190px;
            height: auto;
            animation: swimRight 22s infinite linear;
            animation-delay: 4s;
        }

        /* Obor-Obor Terapung */
        .creature-jellyfish {
            top: 18%;
            right: 5%;
            width: 140px;
            height: auto;
            animation: floatUpDown 7s infinite ease-in-out;
            opacity: 0.9;
        }

        /* Sotong Kurita / Octopus */
        .creature-octopus {
            bottom: 18%;
            left: 2%;
            width: 170px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            animation-delay: 2s;
            opacity: 0.9;
        }

        /* Tapak Sulaiman & Kerang di Dasar Laut */
        .creature-starfish {
            bottom: 12px;
            left: 6%;
            width: 110px;
            height: auto;
            animation: pulseGlow 4s infinite alternate;
        }

        .creature-shell {
            bottom: 12px;
            right: 8%;
            width: 120px;
            height: auto;
            animation: pulseGlow 5s infinite alternate;
        }

        /* Keyframes Animasi Pergerakan */
        @keyframes swimRight {
            0% { transform: translateX(-30vw) scaleX(1); }
            100% { transform: translateX(115vw) scaleX(1); }
        }

        @keyframes swimLeft {
            0% { transform: translateX(115vw) scaleX(-1); }
            100% { transform: translateX(-30vw) scaleX(-1); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(6deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 8px 18px rgba(255,255,255,0.5)); }
        }

        /* Animasi Gelembung Air */
        body::before, body::after {
            content: "🫧";
            position: fixed;
            font-size: 2.2rem;
            opacity: 0.35;
            animation: floatUp 8s infinite linear;
            z-index: 0;
        }
        body::before { left: 12%; animation-duration: 9s; }
        body::after { right: 18%; animation-duration: 7s; animation-delay: 2s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* Kad Utama Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 30, 60, 0.35);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #0284c7;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #bae6fd;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0369a1;
            font-size: 16px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            background-color: #f0f9ff;
            color: #0c4a6e;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        input[type="text"]:focus, select:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3);
        }

        .sub-title {
            text-align: center;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #0284c7;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Container & Butang Interaktif colorful */
        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn-set {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        .btn-blue {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 6px 0px #0369a1;
        }
        .btn-blue:hover { background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%); }

        .btn-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 0px #047857;
        }
        .btn-green:hover { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }

        .btn-home {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0px #334155;
            transition: all 0.15s ease;
        }
        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #334155;
        }

        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }

        /* Item Soalan & Kad Jawapan */
        .item-soalan {
            background-color: #ffffff;
            border: 3px solid #bae6fd;
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.06);
        }

        .item-soalan h3 {
            font-size: 18px;
            color: #0c4a6e;
            line-height: 1.4;
        }

        .pilihan-jawapan label {
            font-weight: 600;
            background: #f0f9ff;
            padding: 14px 18px;
            border: 2px solid #e0f2fe;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #0369a1;
        }

        .pilihan-jawapan label:hover {
            background-color: #e0f2fe;
            border-color: #38bdf8;
            transform: translateX(4px);
        }

        .pilihan-jawapan input[type="radio"] {
            accent-color: #0284c7;
            width: 18px;
            height: 18px;
        }

        /* Container Gambar Soalan */
        .question-image-container {
            text-align: center;
            margin-bottom: 18px;
            background-color: #f8fafc;
            padding: 12px;
            border: 2px dashed #38bdf8;
            border-radius: 16px;
        }

        .question-image, .item-soalan img {
            width: 100% !important;
            max-width: 680px !important;
            height: auto !important;
            max-height: 500px !important;
            border-radius: 12px;
            object-fit: contain !important;
        }

        /* Gaya Khas Gambar Dikecilkan Bagi Soalan 11 - 30 */
        .item-soalan.img-small img,
        .question-image-container.img-small img {
            max-width: 320px !important;
            max-height: 220px !important;
            margin: 0 auto;
            display: block;
        }

        /* Pautan Tersembunyi Khas Untuk Guru */
        .link-guru {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #0284c7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .link-guru:hover {
            background: #e0f2fe;
        }
    </style>
</head>

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function keHalamanUtama() {
        if (document.getElementById('papan-kuiz').style.display === 'block') {
            if (!confirm("Adakah anda pasti mahu kembali ke Utama? Jawapan semasa tidak akan disimpan.")) {
                return;
            }
        }
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Sila isi nama, pilih kelas, dan pilih modul terlebih dahulu!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("Data quizBank tidak dijumpai! Pastikan fail JS modul dimuatkan.");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';
        const kunciPadan = modulKeys.find(key => {
            const keyLower = key.toLowerCase();
            const inputLower = modulInput.toLowerCase();
            return keyLower.startsWith(inputLower) || 
                   keyLower.includes(`module ${nomborModul}`) || 
                   keyLower.includes(`module${nomborModul}`);
        });

        if (!kunciPadan) {
            alert(`Data soalan untuk ${modulInput} (${setTerpilih}) tidak dijumpai. Sila pastikan fail module*.js mengandungi data bagi modul ini.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};

        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;
            const isSmallImg = (nomborSoalan >= 11 && nomborSoalan <= 30);
            const extraClass = isSmallImg ? 'img-small' : '';

            htmlContent += `<div class="item-soalan ${extraClass}">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `
                        <div class="question-image-container ${extraClass}">
                            <img src="${imgStr}" alt="Soalan ${nomborSoalan}" class="question-image" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:red;font-size:13px;\\'>[Gambar gagal dimuatkan: ${imgStr}]</span>';">
                        </div>
                    `;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');

            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="pilihJawapan(${index}, '${pilihan}')">
                        <span style="margin-left: 12px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function pilihJawapan(index, pilihan) {
        jawapanPengguna[index] = pilihan;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`Anda hanya menjawab ${dijawab} daripada ${jumlahSoalan} soalan. Adakah anda pasti ingin menghantar?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) {
                markah++;
            }
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        // SIMPAN REKOD KE LOCALSTORAGE UNTUK DASHBOARD GURU
        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('ms-MY')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #0284c7; font-size: 28px;">🎉 Keputusan Kuiz</h2>
            <div style="background: #f0f9ff; padding: 20px; border-radius: 18px; text-align: left; margin: 20px 0; border: 2px solid #bae6fd;">
                <p><strong>👤 Nama:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>🏫 Kelas:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>📚 Modul:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 32px; color: #059669; margin: 15px 0;">⭐ Markah: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="margin-top: 15px; padding: 14px 28px; font-size: 18px;">🏠 Halaman Utama (HOME)</button>
        `;
    }
</script>

</body>
</html>
