<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Year 3 - Ocean English Quest 🌊</title>
    <!-- Font Mesra Kanak-Kanak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        /* Latar Belakang Biru Lautan Gradien */
        body {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 50%, #0369a1 100%);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMASI HIDUPAN & ELEMENT LAUTAN */
        .ocean-decor {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .creature-dolphin {
            top: 5%;
            width: 200px;
            height: auto;
            animation: swimRight 22s infinite linear;
            opacity: 0.9;
        }

        .creature-jellyfish {
            top: 8%;
            right: 4%;
            width: 120px;
            height: auto;
            animation: floatUpDown 6s infinite ease-in-out;
            opacity: 0.95;
        }

        .creature-fish1 {
            top: 38%;
            left: 3%;
            width: 90px;
            height: auto;
            animation: swimWiggle 9s infinite ease-in-out;
        }

        .creature-fish2 {
            top: 52%;
            right: 4%;
            width: 85px;
            height: auto;
            animation: swimWiggle 11s infinite ease-in-out;
            animation-delay: 2s;
        }

        .creature-coral {
            bottom: 0px;
            left: 1%;
            width: 200px;
            height: auto;
            animation: pulseGlow 5s infinite alternate;
        }

        .creature-submarine {
            bottom: 10px;
            right: 3%;
            width: 140px;
            height: auto;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes swimRight {
            0% { transform: translateX(-30vw) translateY(0px) scale(0.9); }
            50% { transform: translateX(45vw) translateY(-20px) scale(1.05); }
            100% { transform: translateX(115vw) translateY(10px) scale(0.9); }
        }

        @keyframes swimWiggle {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            25% { transform: translateY(-20px) rotate(-6deg) scale(1.05); }
            75% { transform: translateY(15px) rotate(6deg) scale(0.95); }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(-4deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 10px 20px rgba(186, 230, 253, 0.4)); }
        }

        /* Animasi Buih Belakang Card */
        body::before, body::after {
            content: "🫧";
            position: fixed;
            font-size: 2rem;
            opacity: 0.5;
            animation: bubbleRise 9s infinite linear;
            z-index: 0;
        }
        body::before { left: 18%; animation-duration: 10s; }
        body::after { right: 25%; animation-duration: 7s; animation-delay: 2s; }

        @keyframes bubbleRise {
            0% { transform: translateY(105vh) scale(0.8) translateX(0); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) translateX(50px); opacity: 0; }
        }

        /* Kad Utama Glassmorphism Tema Lautan */
        .card {
            background: rgba(240, 253, 250, 0.94);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #7dd3fc;
            box-shadow: 0 20px 45px rgba(3, 105, 161, 0.4);
            padding: 35px 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #0f766e;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 34px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #bae6fd;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        /* TULISAN PAPARAN UTAMA (LABEL, INPUT, SELECT) - SAIZ 20px */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f766e;
            font-size: 20px !important;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #5eead4;
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #f0fdf4;
            color: #042f2e;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        input[type="text"]:focus, select:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35);
        }

        .sub-title {
            text-align: center;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #0284c7;
            font-size: 20px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-set {
            flex: 1;
            min-width: 220px;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 20px !important;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-set:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15);
        }

        /* GET SMART SET: Hijau Emerald Segar */
        .btn-blue {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 0px #047857;
        }
        .btn-blue:hover { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }

        /* REMEDIAL SET: Oren Karang Laut */
        .btn-green {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 6px 0px #c2410c;
        }
        .btn-green:hover { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); }

        /* READING CORNER: Tona Ungu Ceria */
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            box-shadow: 0 6px 0px #7e22ce;
        }
        .btn-purple:hover { background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%); }

        /* GRAMMAR FUN: Tona Merah Jambu */
        .btn-pink {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 6px 0px #be185d;
        }
        .btn-pink:hover { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }

        /* SENTENCE BUILDER: Tona Teal Segar */
        .btn-teal {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            box-shadow: 0 6px 0px #0f766e;
        }
        .btn-teal:hover { background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%); }

        .btn-home {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            padding: 12px 22px;
            border: 2px solid #bae6fd;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0px #0369a1;
            transition: all 0.15s ease;
        }
        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #0369a1;
        }

        #papan-kuiz, #keputusan-kuiz {
            display: none;
        }

        /* Item Soalan & Kad Jawapan */
        .item-soalan {
            background-color: #ffffff;
            border: 3px solid #99f6e4;
            border-left: 8px solid #0284c7;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(15, 118, 110, 0.08);
        }

        /* TULISAN SOALAN - SAIZ 20px */
        .item-soalan h3 {
            font-size: 20px !important;
            color: #042f2e;
            line-height: 1.5;
            font-weight: 700;
        }

        /* TULISAN PILIHAN JAWAPAN - SAIZ 20px */
        .pilihan-jawapan label {
            font-weight: 600;
            background: #f0fdf4;
            padding: 16px 20px;
            border: 2px solid #ccfbf1;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #0f766e;
            font-size: 20px !important;
        }

        .pilihan-jawapan label:hover {
            background-color: #e0f2fe;
            border-color: #bae6fd;
            transform: translateX(4px);
        }

        .pilihan-jawapan input[type="radio"] {
            accent-color: #0284c7;
            width: 22px;
            height: 22px;
        }

        .question-image-container {
            text-align: center;
            margin-bottom: 18px;
            background-color: #f0f9ff;
            padding: 12px;
            border: 2px dashed #38bdf8;
            border-radius: 16px;
        }

        .question-image, .item-soalan img {
            width: 100% !important;
            max-width: 680px !important;
            height: auto !important;
            max-height: 500px !important;
            border-radius: 12px;
            object-fit: contain !important;
        }

        .item-soalan.img-small img,
        .question-image-container.img-small img {
            max-width: 320px !important;
            max-height: 220px !important;
            margin: 0 auto;
            display: block;
        }

        .link-guru {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #0f766e;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .link-guru:hover {
            background: #e0f2fe;
            color: #0369a1;
        }
    </style>
</head>

<script>
    let soalanSemasa = [];
    let jawapanPengguna = {};
    let maklumatPelajar = {};

    function bukaModulLain(url) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;

        if (!nama || !kelas) {
            alert("Sila isi Nama dan pilih Kelas anda terlebih dahulu sebelum menekan butang penerokaan!");
            return;
        }

        // Menyimpan maklumat pelajar ke localStorage supaya boleh digunakan oleh halaman tujuan
        localStorage.setItem('pelajar_aktif', JSON.stringify({ nama, kelas }));
        window.location.href = url;
    }

    function bukaDashboardGuru() {
        const inputLaluan = prompt("🔑 Please enter Teacher's password:");

        if (inputLaluan === "guru123" || inputLaluan === "1234") {
            try {
                sessionStorage.setItem("guru_authenticated", "true");
            } catch(e) {
                console.log("sessionStorage blocked by browser.");
            }
            window.location.href = "dashboard.html";
        } else if (inputLaluan !== null) {
            alert("❌ Incorrect password! Access denied.");
        }
    }

    function keHalamanUtama() {
        if (document.getElementById('papan-kuiz').style.display === 'block') {
            if (!confirm("Are you sure you want to return to Home? Your current answers will not be saved.")) {
                return;
            }
        }
        document.getElementById('borang-mula').style.display = 'block';
        document.getElementById('papan-kuiz').style.display = 'none';
        document.getElementById('keputusan-kuiz').style.display = 'none';
    }

    function mulaKuiz(setTerpilih) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value;
        const modulInput = document.getElementById('modul').value;

        if (!nama || !kelas || !modulInput) {
            alert("Please enter your name, select a class, and select a topic first!");
            return;
        }

        if (typeof quizBank === 'undefined' || !quizBank[setTerpilih]) {
            alert("quizBank data not found! Make sure the module JS files are loaded.");
            return;
        }

        const modulKeys = Object.keys(quizBank[setTerpilih]);
        
        const matchNombor = modulInput.match(/\d+/);
        const nomborModul = matchNombor ? matchNombor[0] : '';

        const kunciPadan = modulKeys.find(key => {
            const matchKey = key.match(/\d+/);
            const nomborKey = matchKey ? matchKey[0] : '';
            return nomborKey === nomborModul;
        });

        if (!kunciPadan) {
            alert(`Question data for ${modulInput} (${setTerpilih}) not found. Please ensure the module*.js file contains data for this topic.`);
            return;
        }

        const dataModul = quizBank[setTerpilih][kunciPadan];
        maklumatPelajar = { nama, kelas, modul: kunciPadan, set: setTerpilih };
        soalanSemasa = [];

        Object.keys(dataModul).forEach(kategori => {
            soalanSemasa = soalanSemasa.concat(dataModul[kategori]);
        });

        jawapanPengguna = {};

        document.getElementById('borang-mula').style.display = 'none';
        document.getElementById('papan-kuiz').style.display = 'block';
        document.getElementById('keputusan-kuiz').style.display = 'none';

        paparSemuaSoalan();
    }

    function paparSemuaSoalan() {
        document.getElementById('label-modul-papar').innerText = `${maklumatPelajar.modul} (${maklumatPelajar.set})`;
        const bekas = document.getElementById('bekas-senarai-soalan');
        let htmlContent = '';

        soalanSemasa.forEach((soalan, index) => {
            const nomborSoalan = index + 1;
            const isSmallImg = (nomborSoalan >= 11 && nomborSoalan <= 30);
            const extraClass = isSmallImg ? 'img-small' : '';

            htmlContent += `<div class="item-soalan ${extraClass}">`;
            
            if (soalan.image) {
                const imgStr = String(soalan.image).trim();
                if (imgStr.startsWith('<')) {
                    htmlContent += imgStr;
                } else {
                    htmlContent += `
                        <div class="question-image-container ${extraClass}">
                            <img src="${imgStr}" alt="Question ${nomborSoalan}" class="question-image" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:red;font-size:16px;\\'>[Failed to load image: ${imgStr}]</span>';">
                        </div>
                    `;
                }
            }

            const teksSoalanBersih = (soalan.q || '').replace(/^\d+[\.\)]\s*/, '');

            htmlContent += `<h3 style="white-space: pre-line; margin-top: 5px;">${nomborSoalan}. ${teksSoalanBersih}</h3>`;
            htmlContent += `<div class="pilihan-jawapan">`;

            soalan.options.forEach((pilihan) => {
                htmlContent += `
                    <label>
                        <input type="radio" name="soalan_${index}" value="${pilihan}" onchange="pilihJawapan(${index}, '${pilihan}')">
                        <span style="margin-left: 14px;">${pilihan}</span>
                    </label>
                `;
            });

            htmlContent += `</div></div>`;
        });

        bekas.innerHTML = htmlContent;
    }

    function pilihJawapan(index, pilihan) {
        jawapanPengguna[index] = pilihan;
    }

    function hantarKuiz() {
        const jumlahSoalan = soalanSemasa.length;
        const dijawab = Object.keys(jawapanPengguna).length;

        if (dijawab < jumlahSoalan) {
            if (!confirm(`You have only answered ${dijawab} out of ${jumlahSoalan} questions. Are you sure you want to submit?`)) {
                return;
            }
        }

        let markah = 0;
        soalanSemasa.forEach((soalan, idx) => {
            if (jawapanPengguna[idx] === soalan.ans) {
                markah++;
            }
        });

        const peratus = Math.round((markah / jumlahSoalan) * 100);

        let senaraiRekod = JSON.parse(localStorage.getItem('rekod_portal_year3') || '[]');
        senaraiRekod.push({
            nama: maklumatPelajar.nama,
            kelas: maklumatPelajar.kelas,
            modul: maklumatPelajar.modul,
            set: maklumatPelajar.set,
            markah: peratus,
            tarikh: new Date().toLocaleDateString('en-GB')
        });
        localStorage.setItem('rekod_portal_year3', JSON.stringify(senaraiRekod));

        document.getElementById('papan-kuiz').style.display = 'none';
        const bekasKeputusan = document.getElementById('keputusan-kuiz');
        bekasKeputusan.style.display = 'block';
        
        bekasKeputusan.innerHTML = `
            <h2 style="color: #0f766e; font-size: 30px;">🎉 Quiz Results</h2>
            <div style="background: #f0fdf4; padding: 22px; border-radius: 18px; text-align: left; margin: 20px 0; border: 2px solid #7dd3fc; font-size: 20px;">
                <p><strong>👤 Name:</strong> ${maklumatPelajar.nama}</p>
                <p><strong>🏫 Class:</strong> ${maklumatPelajar.kelas}</p>
                <p><strong>📚 Topic:</strong> ${maklumatPelajar.modul}</p>
                <p><strong>🎮 Set:</strong> ${maklumatPelajar.set}</p>
            </div>
            <h3 style="font-size: 32px; color: #f97316; margin: 15px 0;">⭐ Score: ${markah} / ${jumlahSoalan} (${peratus}%)</h3>
            <button class="btn-home" onclick="keHalamanUtama()" style="margin-top: 15px; padding: 14px 28px; font-size: 20px;">🏠 Main Menu (HOME)</button>
        `;
    }
</script>
