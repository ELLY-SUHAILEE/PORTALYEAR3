<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner - Year 3 Forest Quest 📖</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-size: 20px !important;
        }

        /* KAD UTAMA GLASSMORPHISM */
        .card {
            background: rgba(245, 253, 248, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa;
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 30px 25px;
            text-align: center;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-home {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            color: #052e16;
            padding: 10px 20px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            font-size: 20px !important;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 0px #16a34a;
            transition: all 0.15s ease;
        }
        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #16a34a;
        }

        h1 {
            color: #1e3a8a;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 0px #bfdbfe;
        }

        .instruction {
            color: #1e40af;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 20px !important;
        }

        /* TAB PILIHAN MOD READING */
        .tab-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 220px;
            padding: 16px;
            font-size: 20px !important;
            font-weight: 700;
            border: 3px solid #bfdbfe;
            border-radius: 18px;
            background: #ffffff;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0px rgba(30, 64, 175, 0.15);
        }

        .tab-btn.active-tab {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 6px 0px #1e3a8a;
        }

        /* TAJUK / STATUS SEMASA */
        .current-title {
            background: #dbeafe;
            color: #1e40af;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            border: 2px solid #93c5fd;
            font-size: 20px !important;
        }

        /* PEMAIN VIDEO YOUTUBE (EMBED) */
        .video-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #93c5fd;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 56.25%; /* Nisbah 16:9 */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* PAPARAN POSTER GAMBAR */
        .poster-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 15px;
            border: 4px solid #93c5fd;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            text-align: center;
        }

        .poster-container img {
            width: 100%;
            max-width: 750px;
            height: auto;
            max-height: 700px;
            border-radius: 12px;
            object-fit: contain;
        }

        /* SENARAI BUTANG VIDEO & POSTER */
        .reading-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .item-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #1d4ed8;
            border: 3px solid #bfdbfe;
            border-radius: 16px;
            font-weight: bold;
            font-size: 20px !important;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .item-btn:hover, .item-btn.active {
            background-color: #dbeafe;
            border-color: #3b82f6;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .icon-indicator {
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="nav-header">
        <a href="index.html" class="btn-home">🏠 HOME</a>
        <span style="font-weight: 700; color: #1e40af; font-size: 20px !important;">Reading Corner 📖</span>
    </div>

    <h1>📖 Year 3 Reading Corner</h1>
    <p class="instruction">Choose your preferred reading mode below:</p>

    <div class="tab-container" role="tablist">
        <button id="tab-youtube" class="tab-btn active-tab" role="tab" aria-selected="true" onclick="pilihMod('youtube')">🎥 Reading with YouTube</button>
        <button id="tab-poster" class="tab-btn" role="tab" aria-selected="false" onclick="pilihMod('poster')">🖼️ Reading with Poster</button>
    </div>

    <div id="seksyen-youtube" role="tabpanel">
        <div class="current-title" id="now-playing-video">▶️ Currently Playing: 1. My House</div>

        <div class="video-container">
            <iframe 
                id="main-player"
                src="https://www.youtube.com/embed/dvwRKWvU1go?autoplay=0&rel=0" 
                title="YouTube Video Player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="reading-list">
            <button class="item-btn active" onclick="tukarVideo('dvwRKWvU1go', '1. My House', this)">
                <span>📖 1. My House</span>
                <span class="icon-indicator">▶️</span>
            </button>

            <button class="item-btn" onclick="tukarVideo('wSOUN2VxeaI', '2. My Day', this)">
                <span>📖 2. My Day</span>
                <span class="icon-indicator">▶️</span>
            </button>

            <button class="item-btn" onclick="tukarVideo('Nwb31bhBRdc', '3. Frog\'s Lunch', this)">
                <span>📖 3. Frog's Lunch</span>
                <span class="icon-indicator">▶️</span>
            </button>

            <button class="item-btn" onclick="tukarVideo('eXw3MH9MT2k', '4. Hello, How Are You?', this)">
                <span>📖 4. Hello, How Are You?</span>
                <span class="icon-indicator">▶️</span>
            </button>

            <button class="item-btn" onclick="tukarVideo('MCQoWGAmj7w', '5. Speaking Practice', this)">
                <span>📖 5. Speaking Practice</span>
                <span class="icon-indicator">▶️</span>
            </button>
        </div>
    </div>

    <div id="seksyen-poster" style="display: none;" role="tabpanel">
        <div class="current-title" id="now-playing-poster">🖼️ Currently Viewing: Poster 1</div>

        <div class="poster-container">
            <img id="main-poster" src="poster/poster1.png" alt="Poster 1" onerror="cubaLainFormat(this)">
        </div>

        <div class="poster-grid">
            <button class="item-btn active" onclick="tukarPoster('poster/poster1.png', 'Poster 1', this)">
                <span>🖼️ Poster 1</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster2.png', 'Poster 2', this)">
                <span>🖼️ Poster 2</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster3.png', 'Poster 3', this)">
                <span>🖼️ Poster 3</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster4.png', 'Poster 4', this)">
                <span>🖼️ Poster 4</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster5.png', 'Poster 5', this)">
                <span>🖼️ Poster 5</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster6.png', 'Poster 6', this)">
                <span>🖼️ Poster 6</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster7.png', 'Poster 7', this)">
                <span>🖼️ Poster 7</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster8.png', 'Poster 8', this)">
                <span>🖼️ Poster 8</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster9.png', 'Poster 9', this)">
                <span>🖼️ Poster 9</span>
                <span class="icon-indicator">🔍</span>
            </button>

            <button class="item-btn" onclick="tukarPoster('poster/poster10.png', 'Poster 10', this)">
                <span>🖼️ Poster 10</span>
                <span class="icon-indicator">🔍</span>
            </button>
        </div>
    </div>
</div>

<script>
    // FUNGSI TUKAR TAB (MOD)
    function pilihMod(mod) {
        const tabYoutube = document.getElementById('tab-youtube');
        const tabPoster = document.getElementById('tab-poster');
        const seksyenYoutube = document.getElementById('seksyen-youtube');
        const seksyenPoster = document.getElementById('seksyen-poster');

        if (mod === 'youtube') {
            tabYoutube.classList.add('active-tab');
            tabYoutube.setAttribute('aria-selected', 'true');
            tabPoster.classList.remove('active-tab');
            tabPoster.setAttribute('aria-selected', 'false');
            seksyenYoutube.style.display = 'block';
            seksyenPoster.style.display = 'none';
        } else {
            tabPoster.classList.add('active-tab');
            tabPoster.setAttribute('aria-selected', 'true');
            tabYoutube.classList.remove('active-tab');
            tabYoutube.setAttribute('aria-selected', 'false');
            seksyenPoster.style.display = 'block';
            seksyenYoutube.style.display = 'none';
        }
    }

    // FUNGSI TUKAR VIDEO YOUTUBE
    function tukarVideo(videoId, tajuk, element) {
        const player = document.getElementById('main-player');
        player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;

        document.getElementById('now-playing-video').innerText = `▶️ Currently Playing: ${tajuk}`;

        const buttons = document.querySelectorAll('#seksyen-youtube .item-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        if (window.innerWidth <= 768) {
            document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // FUNGSI TUKAR GAMBAR POSTER
    function tukarPoster(pathGambar, tajuk, element) {
        const poster = document.getElementById('main-poster');
        poster.src = pathGambar;
        poster.alt = tajuk;

        document.getElementById('now-playing-poster').innerText = `🖼️ Currently Viewing: ${tajuk}`;

        const buttons = document.querySelectorAll('#seksyen-poster .item-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        if (window.innerWidth <= 768) {
            document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // FUNGSI ERROR HANDLING UNTUK FORMAT GAMBAR (.png / .jpg / .jpeg)
    function cubaLainFormat(img) {
        if (img.src.endsWith('.png')) {
            img.src = img.src.replace('.png', '.jpg');
        } else if (img.src.endsWith('.jpg')) {
            img.src = img.src.replace('.jpg', '.jpeg');
        } else {
            img.onerror = null;
            img.parentElement.innerHTML = '<p style="color:red; font-size:18px; padding:20px;">⚠️ Image failed to load. Please make sure poster files exist in the <strong>poster/</strong> folder (e.g., poster1.png or poster1.jpg).</p>';
        }
    }
</script>

</body>
</html>
