<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner - Year 3 Forest Quest 📖</title>
    <!-- Font Mesra Kanak-Kanak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-size: 20px !important;
        }

        /* KAD UTAMA */
        .card {
            background: rgba(245, 253, 248, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 800px;
            border-radius: 28px;
            border: 4px solid #fed7aa;
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 30px 25px;
            text-align: center;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-home {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            color: #052e16;
            padding: 10px 20px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            font-size: 20px !important;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 0px #16a34a;
        }

        h1 {
            color: #1e3a8a;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 0px #bfdbfe;
        }

        .instruction {
            color: #1e40af;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 20px !important;
        }

        /* TAJUK VIDEO SEMASA */
        .current-title {
            background: #dbeafe;
            color: #1e40af;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 20px;
            border: 2px solid #93c5fd;
            font-size: 20px !important;
        }

        /* PEMAIN VIDEO YOUTUBE (EMBED) */
        .video-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #93c5fd;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 56.25%; /* Nisbah 16:9 */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SENARAI BUTANG VIDEO */
        .reading-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #1d4ed8;
            border: 3px solid #bfdbfe;
            border-radius: 16px;
            font-weight: bold;
            font-size: 20px !important;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .video-btn:hover, .video-btn.active {
            background-color: #dbeafe;
            border-color: #3b82f6;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .play-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="nav-header">
        <a href="index.html" class="btn-home">🏠 HOME</a>
        <span style="font-weight: 700; color: #1e40af; font-size: 20px !important;">Reading Corner 📖</span>
    </div>

    <h1>📖 Year 3 Reading Corner</h1>
    <p class="instruction">Klik mana-mana tajuk di bawah untuk memainkan video terus di skrin:</p>

    <!-- TAJUK VIDEO SEMASA -->
    <div class="current-title" id="now-playing">▶️ Sedang Dipapar: 1. My House</div>

    <!-- PEMAIN VIDEO YOUTUBE -->
    <div class="video-container">
        <iframe 
            id="main-player"
            src="https://www.youtube.com/embed/dvwRKWvU1go?autoplay=0&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- SENARAI PAUTAN READING -->
    <div class="reading-list">
        <button class="video-btn active" onclick="tukarVideo('dvwRKWvU1go', '1. My House', this)">
            <span>📖 1. My House</span>
            <span class="play-icon">▶️</span>
        </button>
        
        <button class="video-btn" onclick="tukarVideo('wSOUN2VxeaI', '2. My Day', this)">
            <span>📖 2. My Day</span>
            <span class="play-icon">▶️</span>
        </button>

        <button class="video-btn" onclick="tukarVideo('Nwb31bhBRdc', '3. Frog\'s Lunch', this)">
            <span>📖 3. Frog's Lunch</span>
            <span class="play-icon">▶️</span>
        </button>

        <button class="video-btn" onclick="tukarVideo('eXw3MH9MT2k', '4. Hello, How Are You?', this)">
            <span>📖 4. Hello, How Are You?</span>
            <span class="play-icon">▶️</span>
        </button>

        <button class="video-btn" onclick="tukarVideo('MCQoWGAmj7w', '5. Speaking Practice', this)">
            <span>📖 5. Speaking Practice</span>
            <span class="play-icon">▶️</span>
        </button>
    </div>
</div>

<script>
    function tukarVideo(videoId, tajuk, element) {
        // Tukar ID Video YouTube
        const player = document.getElementById('main-player');
        player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;

        // Kemaskini Tajuk Dipapar
        document.getElementById('now-playing').innerText = `▶️ Sedang Dipapar: ${tajuk}`;

        // Kemaskini Butang Aktif
        const buttons = document.querySelectorAll('.video-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');

        // Skrol automatik ke pemain video
        document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
