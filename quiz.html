<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 3 English Quiz</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('poster.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #c8d6e5;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .student-tag {
            font-size: 0.95rem;
            font-weight: 600;
            background: #e17055;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .module-title-tag {
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            color: #6c5ce7;
            font-weight: 700;
        }

        .btn-home {
            background: #74b9ff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .btn-home:hover {
            background: #0984e3;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            min-height: 80px;
            text-align: left;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid #c8d6e5;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            border-color: #6c5ce7;
            background-color: #a29bfe;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }

        .btn-option.wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }

        .feedback-box {
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 15px;
            min-height: 35px;
        }

        .score-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <!-- Bar Header Atas -->
        <div class="header-bar">
            <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Home</a>
            <span class="module-title-tag" id="displayModuleName">Loading...</span>
            <span class="student-tag" id="displayStudentInfo">Student</span>
        </div>

        <!-- Ruang Soalan -->
        <div class="question-box" id="questionText">
            Sila tunggu, soalan sedang dimuatkan...
        </div>

        <!-- Ruang Pilihan Jawapan -->
        <div class="options-grid" id="optionsContainer"></div>

        <div class="feedback-box" id="feedbackText"></div>
    </div>

    <script>
        const studentName = localStorage.getItem('studentName') || 'Student';
        const studentClass = localStorage.getItem('studentClass') || '';
        const selectedModule = localStorage.getItem('selectedModule') || 'English Quiz';
        const moduleScript = localStorage.getItem('moduleScript');

        document.getElementById('displayStudentInfo').textContent = `${studentName} (${studentClass})`;
        document.getElementById('displayModuleName').textContent = selectedModule;

        let currentQuestionIndex = 0;
        let score = 0;
        let activeQuestions = [];

        if (moduleScript) {
            const scriptTag = document.createElement('script');
            scriptTag.src = moduleScript;

            scriptTag.onload = () => {
                // Cari soalan di dalam quizBank
                activeQuestions = findQuestionsInQuizBank();

                if (activeQuestions && activeQuestions.length > 0) {
                    paparSoalan();
                } else {
                    document.getElementById('questionText').innerHTML = "⚠️ Soalan tidak dijumpai dalam <code>" + moduleScript + "</code>.";
                }
            };

            scriptTag.onerror = () => {
                document.getElementById('questionText').innerHTML = "⚠️ Gagal memuatkan <code>" + moduleScript + "</code>. Pastikan nama fail betul di GitHub.";
            };

            document.body.appendChild(scriptTag);
        } else {
            document.getElementById('questionText').textContent = "⚠️ Tiada modul dipilih. Sila kembali ke Laman Utama.";
        }

        // Pengesan Automatik untuk quizBank & Objek Lain
        function findQuestionsInQuizBank() {
            // 1. Geledah window.quizBank
            if (window.quizBank) {
                let res = searchBank(window.quizBank);
                if (res) return res;
            }

            // 2. Semak pembolehubah biasa
            const standardVars = ['questions', 'quizQuestions', 'moduleQuestions'];
            for (let v of standardVars) {
                if (window[v] && Array.isArray(window[v]) && window[v].length > 0) return window[v];
            }

            return null;
        }

        // Rekursif Geledah Objek QuizBank
        function searchBank(obj) {
            if (!obj) return null;
            if (Array.isArray(obj) && obj.length > 0) {
                let item = obj[0];
                if (item && typeof item === 'object' && (item.question || item.soalan || item.text || item.q || item.options || item.pilihan)) {
                    return obj;
                }
            } else if (typeof obj === 'object') {
                for (let key in obj) {
                    let found = searchBank(obj[key]);
                    if (found) return found;
                }
            }
            return null;
        }

        // Memaparkan Soalan (Menyokong Gambar)
        function paparSoalan() {
            if (currentQuestionIndex >= activeQuestions.length) {
                tamatKuiz();
                return;
            }

            const q = activeQuestions[currentQuestionIndex];
            let qText = q.question || q.soalan || q.text || q.q || "";

            // Guna innerHTML untuk sokong gambar wrapCenterImage
            document.getElementById('questionText').innerHTML = `<div style="font-size:0.9rem; color:#888; margin-bottom:5px;">Question ${currentQuestionIndex + 1} of ${activeQuestions.length}</div>` + qText;
            document.getElementById('feedbackText').textContent = "";

            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";

            const opts = q.options || q.pilihan || q.answers || q.choices || [];
            opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = opt;
                btn.onclick = () => semakJawapan(idx, q, btn);
                container.appendChild(btn);
            });
        }

        // Semakan Jawapan
        function semakJawapan(selectedIdx, qObj, btnEl) {
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(b => b.disabled = true);

            let correctIdx = qObj.answer !== undefined ? qObj.answer : (qObj.jawapan !== undefined ? qObj.jawapan : qObj.correct);
            
            if (typeof correctIdx === 'string') {
                const opts = qObj.options || qObj.pilihan || qObj.answers || qObj.choices || [];
                correctIdx = opts.indexOf(correctIdx);
            }

            if (selectedIdx === correctIdx) {
                btnEl.classList.add('correct');
                document.getElementById('feedbackText').innerHTML = "🎉 Excellent! Correct Answer!";
                document.getElementById('feedbackText').style.color = "#2ecc71";
                score++;
            } else {
                btnEl.classList.add('wrong');
                if (buttons[correctIdx]) buttons[correctIdx].classList.add('correct');
                document.getElementById('feedbackText').innerHTML = "❌ Oops! Keep Trying!";
                document.getElementById('feedbackText').style.color = "#e74c3c";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                paparSoalan();
            }, 1800);
        }

        // Tamat Kuiz
        function tamatKuiz() {
            document.getElementById('questionText').style.textAlign = 'center';
            document.getElementById('questionText').innerHTML = `🏆 Quiz Completed!`;
            document.getElementById('optionsContainer').innerHTML = `
                <div class="score-box">
                    Your Score: ${score} / ${activeQuestions.length}
                </div>
                <button class="btn-home" style="margin-top:20px; padding: 12px 25px; font-size:1rem;" onclick="location.href='index.html'">
                    Back to Home
                </button>
            `;
            document.getElementById('feedbackText').textContent = "Well done! Keep up the good work!";
            document.getElementById('feedbackText').style.color = "#6c5ce7";
        }
    </script>
</body>
</html>
