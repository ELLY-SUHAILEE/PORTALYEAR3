<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 3 English Quiz</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('poster.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #c8d6e5;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .student-tag {
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
            background: #e17055;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .module-title-tag {
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            color: #6c5ce7;
            font-weight: 700;
        }

        .btn-home {
            background: #74b9ff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .btn-home:hover {
            background: #0984e3;
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid #c8d6e5;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            border-color: #6c5ce7;
            background-color: #a29bfe;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Gaya Status Maklum Balas */
        .feedback-box {
            font-family: 'Fredoka', cursive;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 15px;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <!-- Bar Header Atas -->
        <div class="header-bar">
            <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Home</a>
            <span class="module-title-tag" id="displayModuleName">Loading...</span>
            <span class="student-tag" id="displayStudentInfo">Student</span>
        </div>

        <!-- Ruang Soalan -->
        <div class="question-box" id="questionText">
            Sila tunggu, soalan sedang dimuatkan...
        </div>

        <!-- Ruang Pilihan Jawapan -->
        <div class="options-grid" id="optionsContainer">
            <!-- Pilihan jawapan daripada JavaScript akan dimasukkan di sini -->
        </div>

        <div class="feedback-box" id="feedbackText"></div>
    </div>

    <!-- Skrip Pengendali Kuiz -->
    <script>
        // Ambil data profil murid daripada LocalStorage
        const studentName = localStorage.getItem('studentName') || 'Student';
        const studentClass = localStorage.getItem('studentClass') || '';
        const selectedModule = localStorage.getItem('selectedModule') || 'English Quiz';
        const moduleScript = localStorage.getItem('moduleScript');

        // Paparkan profil & nama modul
        document.getElementById('displayStudentInfo').textContent = `${studentName} (${studentClass})`;
        document.getElementById('displayModuleName').textContent = selectedModule;

        // Muat naik fail JS modul pilihan secara dinamik (cth: module1.js)
        if (moduleScript) {
            const scriptTag = document.createElement('script');
            scriptTag.src = moduleScript;
            scriptTag.onload = () => {
                if (typeof initQuiz === 'function') {
                    initQuiz();
                }
            };
            document.body.appendChild(scriptTag);
        } else {
            document.getElementById('questionText').textContent = "⚠️ Fail modul tidak ditemui. Sila kembali ke Laman Utama.";
        }
    </script>
</body>
</html>
