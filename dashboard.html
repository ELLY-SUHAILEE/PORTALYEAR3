<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Year 3 English - Analisa Dashboard</title>
  <!-- Chart.js CDN untuk paparan carta -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* TOP NAVBAR */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .app-title {
      font-size: 24px;
      font-weight: bold;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-rekod-guru {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* SUB HEADER */
    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .dashboard-title {
      font-size: 22px;
      font-weight: bold;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-keluar {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* GRID 3 KAD ANALISA */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      height: 220px;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }
    .card-list ul {
      margin: 0;
      padding-left: 18px;
    }
    .card-list li {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    /* TEMA KAD METRIK */
    .card-intervensi {
      border: 2px solid #fca5a5;
      background-color: #fef2f2;
    }
    .card-intervensi .card-title { color: #b91c1c; }
    
    .card-cemerlang {
      border: 2px solid #86efac;
      background-color: #f0fdf4;
    }
    .card-cemerlang .card-title { color: #15803d; }

    .card-sukar {
      border: 2px solid #fde047;
      background-color: #fefce8;
    }
    .card-sukar .card-title { color: #a16207; }

    /* GRID CARTA */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
    }
    .chart-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /* TEXT HIGHLIGHTS */
    .score-red { color: #ef4444; font-weight: bold; }
    .score-green { color: #16a34a; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <!-- TOP NAVBAR -->
    <div class="top-nav">
      <div class="app-title">📖 Reading Tracker App</div>
      <button class="btn-rekod-guru" onclick="keSenaraiRekod()">🔒 Rekod Guru</button>
    </div>

    <!-- SUB HEADER -->
    <div class="sub-header">
      <div class="dashboard-title">📊 Analisa & Rekod Murid</div>
      <button class="btn-keluar" onclick="logKeluar()">Keluar Rekod</button>
    </div>

    <!-- 3 KAD STATISTIK -->
    <div class="analytics-grid">
      <!-- KAD 1: INTERVENSI -->
      <div class="card card-intervensi">
        <div class="card-title">⚠️ Perlu Intervensi (&lt; 60%)</div>
        <div class="card-list" id="list-intervensi">
          <p style="font-size: 13px; color: #64748b;">⏳ Memuatkan data...</p>
        </div>
      </div>

      <!-- KAD 2: CEMERLANG -->
      <div class="card card-cemerlang">
        <div class="card-title">🌟 Murid Cemerlang (&ge; 90%)</div>
        <div class="card-list" id="list-cemerlang">
          <p style="font-size: 13px; color: #64748b;">⏳ Memuatkan data...</p>
        </div>
      </div>

      <!-- KAD 3: MODUL SUKAR -->
      <div class="card card-sukar">
        <div class="card-title">📉 Analisa Modul Sukar</div>
        <div class="card-list" id="list-modul-sukar">
          <p style="font-size: 13px; color: #64748b;">⏳ Memuatkan data...</p>
        </div>
      </div>
    </div>

    <!-- CARTA VISUAL -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="card-title" style="color: #334155;">📊 Purata Peratusan Pencapaian Mengikut Modul</div>
        <div class="chart-container">
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="card-title" style="color: #334155;">🍩 Pecahan Tahap Penguasaan Murid</div>
        <div class="chart-container">
          <canvas id="doughnutChart"></canvas>
        </div>
      </div>
    </div>
  </div>

<script>
  if (sessionStorage.getItem("guru_authenticated") !== "true") {
    alert("🔒 Akses disekat! Sila log masuk terlebih dahulu.");
    window.location.href = "index.html";
  }

  const PAUTAN_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxCd2cvXVKr2ZuUswrZWVg19spQVISjI97vzHz8nPhLi5rwhd4ydhHHEfnJMGWH1kD7/exec";

  let barChartInstance = null;
  let doughnutChartInstance = null;

  window.onload = function() {
    muatDataAnalisa();
  };

  function muatDataAnalisa() {
    fetch(PAUTAN_APPS_SCRIPT)
      .then(res => res.json())
      .then(data => {
        prosesDataAnalisa(data);
      })
      .catch(err => {
        console.error("Gagal memuatkan data:", err);
      });
  }

  function prosesDataAnalisa(data) {
    if (!data || data.length === 0) return;

    let intervensiArr = [];
    let cemerlangArr = [];
    let moduleStats = {}; 

    let totalIntervensi = 0;
    let totalSederhana = 0;
    let totalCemerlang = 0;

    data.forEach(row => {
      const nama = row[1] || 'Murid';
      const kelas = row[2] || '-';
      const modul = row[3] || 'MODULE 1';
      
      let peratusRaw = row[5] ? row[5].toString().replace('%', '') : '0';
      let peratus = parseFloat(peratusRaw) || 0;

      // 1. Pengasingan Murid Intervensi & Cemerlang
      if (peratus < 60) {
        intervensiArr.push({ nama, kelas, modul, peratus });
        totalIntervensi++;
      } else if (peratus >= 90) {
        cemerlangArr.push({ nama, kelas, modul, peratus });
        totalCemerlang++;
      } else {
        totalSederhana++;
      }

      // 2. Kumpulan Statistik Modul
      if (!moduleStats[modul]) {
        moduleStats[modul] = { totalScore: 0, count: 0 };
      }
      moduleStats[modul].totalScore += peratus;
      moduleStats[modul].count += 1;
    });

    // Kemaskini Kad Intervensi
    const listIntervensi = document.getElementById('list-intervensi');
    if (intervensiArr.length === 0) {
      listIntervensi.innerHTML = '<p style="font-size:13px;">Tiada murid perlu intervensi.</p>';
    } else {
      let html = '<ul>';
      intervensiArr.forEach(item => {
        html += `<li><b>${item.nama}</b> (${item.kelas}) - ${item.modul}: <span class="score-red">${item.peratus}%</span></li>`;
      });
      html += '</ul>';
      listIntervensi.innerHTML = html;
    }

    // Kemaskini Kad Cemerlang
    const listCemerlang = document.getElementById('list-cemerlang');
    if (cemerlangArr.length === 0) {
      listCemerlang.innerHTML = '<p style="font-size:13px;">Tiada murid capai ≥ 90%.</p>';
    } else {
      let html = '<ul>';
      cemerlangArr.forEach(item => {
        html += `<li><b>${item.nama}</b> (${item.kelas}) - ${item.modul}: <span class="score-green">${item.peratus}%</span></li>`;
      });
      html += '</ul>';
      listCemerlang.innerHTML = html;
    }

    // Kemaskini Kad Modul Sukar & Data Carta Bar
    let modulesList = Object.keys(moduleStats).sort();
    let moduleAverages = [];
    let moduleSukarArr = [];

    modulesList.forEach(m => {
      let avg = Math.round(moduleStats[m].totalScore / moduleStats[m].count);
      moduleAverages.push(avg);
      moduleSukarArr.push({ modul: m, avg: avg, count: moduleStats[m].count });
    });

    // Susun modul mengikut purata markah terendah
    moduleSukarArr.sort((a, b) => a.avg - b.avg);

    const listSukar = document.getElementById('list-modul-sukar');
    let htmlSukar = '<ul>';
    moduleSukarArr.forEach(item => {
      htmlSukar += `<li><b>${item.modul}</b>: Purata <span class="score-green">${item.avg}%</span> (${item.count} percubaan)</li>`;
    });
    htmlSukar += '</ul>';
    listSukar.innerHTML = htmlSukar;

    // BINA CARTA BAR
    binaBarChart(modulesList, moduleAverages);

    // BINA CARTA DOUGHNUT
    binaDoughnutChart(totalIntervensi, totalSederhana, totalCemerlang);
  }

  function binaBarChart(labels, dataValues) {
    const ctx = document.getElementById('barChart').getContext('2d');
    if (barChartInstance) barChartInstance.destroy();

    barChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          data: dataValues,
          backgroundColor: '#0284c7',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: { callback: v => v + '%' }
          }
        }
      }
    });
  }

  function binaDoughnutChart(intervensi, sederhana, cemerlang) {
    const ctx = document.getElementById('doughnutChart').getContext('2d');
    if (doughnutChartInstance) doughnutChartInstance.destroy();

    doughnutChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Intervensi (<60%)', 'Sederhana (60-89%)', 'Cemerlang (≥90%)'],
        datasets: [{
          data: [intervensi, sederhana, cemerlang],
          backgroundColor: ['#ef4444', '#f59e0b', '#22c55e']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' }
        }
      }
    });
  }

  function keSenaraiRekod() {
    window.location.href = "rekod.html";
  }

  function logKeluar() {
    sessionStorage.removeItem("guru_authenticated");
    window.location.href = "index.html";
  }
</script>
</body>
</html>
