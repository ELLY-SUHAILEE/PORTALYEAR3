<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar & Tenses - Year 3 Forest Quest ✏️</title>
    <!-- Font Mesra Kanak-Kanak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', Arial, sans-serif;
        }

        body {
            background-color: #047857;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-size: 20px !important;
        }

        /* KAD UTAMA GLASSMORPHISM */
        .card {
            background: rgba(245, 253, 248, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 28px;
            border: 4px solid #fed7aa;
            box-shadow: 0 20px 45px rgba(5, 46, 22, 0.4);
            padding: 30px 25px;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-home {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
            color: #052e16;
            padding: 10px 20px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            font-size: 20px !important;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 0px #16a34a;
            transition: all 0.15s ease;
        }

        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #16a34a;
        }

        h1 {
            color: #831843;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 32px;
            text-align: center;
            text-shadow: 2px 2px 0px #fbcfe8;
        }

        .instruction {
            color: #9d174d;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 20px !important;
            text-align: center;
        }

        /* TAB KATEGORI: GRAMMAR VS TENSES */
        .tab-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            font-size: 20px !important;
            font-weight: 700;
            border: 3px solid #fbcfe8;
            border-radius: 18px;
            background: #ffffff;
            color: #be185d;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0px rgba(190, 24, 93, 0.15);
            text-align: center;
        }

        .tab-btn.active-tab {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: #ffffff;
            border-color: #be185d;
            box-shadow: 0 6px 0px #be185d;
        }

        /* PILIHAN TAJUK (SELECT TOPIC) */
        .topic-select-container {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #831843;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid #f472b6;
            border-radius: 16px;
            font-size: 20px !important;
            outline: none;
            background-color: #fdf2f8;
            color: #831843;
            font-weight: 600;
        }

        /* KAD NOTA RINGKAS */
        .notes-card {
            background: #ffffff;
            border: 3px solid #fbcfe8;
            border-left: 8px solid #ec4899;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        .notes-card h2 {
            margin-top: 0;
            color: #be185d;
            font-size: 24px;
        }

        .notes-card ul {
            margin: 10px 0;
            padding-left: 25px;
        }

        .notes-card li {
            margin-bottom: 8px;
            color: #374151;
        }

        /* KUIZ SOALAN */
        .quiz-container {
            margin-top: 20px;
        }

        .question-card {
            background: #ffffff;
            border: 2px solid #fbcfe8;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .question-card p {
            margin: 0 0 12px 0;
            font-weight: 700;
            color: #1f2937;
        }

        .option-label {
            display: flex;
            align-items: center;
            background: #fdf2f8;
            padding: 12px 16px;
            border: 2px solid #fbcfe8;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #831843;
            font-weight: 600;
        }

        .option-label:hover {
            background: #fce7f3;
            border-color: #ec4899;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: #ec4899;
            width: 20px;
            height: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
            font-size: 20px !important;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0px #be185d;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #be185d;
        }

        .score-box {
            display: none;
            background: #fdf2f8;
            border: 3px solid #ec4899;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="nav-header">
        <a href="index.html" class="btn-home">🏠 HOME</a>
        <span style="font-weight: 700; color: #be185d;">Grammar Fun ✏️</span>
    </div>

    <h1>✏️ Year 3 Grammar & Tenses</h1>
    <p class="instruction">Select category and topic to read notes & test your skills!</p>

    <!-- TAB SWITCHER -->
    <div class="tab-container">
        <button id="tab-grammar" class="tab-btn active-tab" onclick="switchCategory('grammar')">📘 GRAMMAR</button>
        <button id="tab-tenses" class="tab-btn" onclick="switchCategory('tenses')">⏰ TENSES</button>
    </div>

    <!-- TOPIC SELECTOR -->
    <div class="topic-select-container">
        <label for="topic-select">📌 Select Topic:</label>
        <select id="topic-select" onchange="loadTopicData()"></select>
    </div>

    <!-- NOTES DISPLAY -->
    <div class="notes-card" id="notes-display"></div>

    <!-- QUIZ DISPLAY -->
    <div class="quiz-container">
        <div id="questions-display"></div>
        <button class="btn-submit" onclick="submitQuiz()">🚀 Submit Quiz</button>
        <div class="score-box" id="score-box"></div>
    </div>
</div>

<script>
    let currentCategory = 'grammar';

    const grammarData = {
        topic1: {
            title: "1. Have got / Has got",
            notes: `
                <h2>💡 Grammar Rule: Have got / Has got</h2>
                <ul>
                    <li><strong>Have got</strong> is used with: <em>I, You, We, They</em> (e.g., "I have got brown eyes.")</li>
                    <li><strong>Has got</strong> is used with: <em>He, She, It</em> (e.g., "She has got straight hair.")</li>
                    <li><strong>Haven't got / Hasn't got</strong> are used for negative sentences.</li>
                </ul>
            `,
            questions: [
                { q: "1. She _____ got long curly hair.", options: ["has", "have", "is"], ans: "has" },
                { q: "2. I _____ got twenty marbles.", options: ["has", "have", "are"], ans: "have" },
                { q: "3. They _____ got blonde hair.", options: ["hasn't", "haven't", "isn't"], ans: "haven't" },
                { q: "4. He _____ got a big shell collection.", options: ["has", "have", "am"], ans: "has" },
                { q: "5. _____ you got a purple bag?", options: ["Has", "Have", "Do"], ans: "Have" },
                { q: "6. My brother _____ got glasses.", options: ["hasn't", "haven't", "don't"], ans: "hasn't" },
                { q: "7. We _____ got English class today.", options: ["has", "have", "is"], ans: "have" },
                { q: "8. _____ she got a pet cat?", options: ["Has", "Have", "Is"], ans: "Has" }
            ]
        },
        topic2: {
            title: "2. Prepositions of Time (in, on, at)",
            notes: `
                <h2>💡 Grammar Rule: Prepositions of Time</h2>
                <ul>
                    <li><strong>IN</strong>: Months, years, seasons (e.g., <em>in December, in summer</em>)</li>
                    <li><strong>ON</strong>: Days, specific dates (e.g., <em>on Monday, on 5th May</em>)</li>
                    <li><strong>AT</strong>: Specific times, night (e.g., <em>at 8 o'clock, at night</em>)</li>
                </ul>
            `,
            questions: [
                { q: "1. My birthday is _____ July.", options: ["in", "on", "at"], ans: "in" },
                { q: "2. We play football _____ Fridays.", options: ["in", "on", "at"], ans: "on" },
                { q: "3. I wake up _____ 6:30 AM.", options: ["in", "on", "at"], ans: "at" },
                { q: "4. It is cold _____ winter.", options: ["in", "on", "at"], ans: "in" },
                { q: "5. The party is _____ Saturday afternoon.", options: ["in", "on", "at"], ans: "on" },
                { q: "6. Stars shine bright _____ night.", options: ["in", "on", "at"], ans: "at" },
                { q: "7. School starts _____ August.", options: ["in", "on", "at"], ans: "in" },
                { q: "8. Let's meet _____ 3 o'clock.", options: ["in", "on", "at"], ans: "at" }
            ]
        },
        topic3: {
            title: "3. Possessive Pronouns & Quantifiers",
            notes: `
                <h2>💡 Grammar Rule: Possessive Pronouns & Quantifiers</h2>
                <ul>
                    <li><strong>Possessive Pronouns</strong>: <em>mine, yours, his, hers, ours, theirs</em>.</li>
                    <li><strong>SOME</strong>: Used in positive sentences (e.g., "There are <em>some</em> apples.")</li>
                    <li><strong>ANY</strong>: Used in negative sentences & questions (e.g., "Are there <em>any</em> eggs?")</li>
                </ul>
            `,
            questions: [
                { q: "1. This bag belongs to me. It is _____.", options: ["mine", "yours", "his"], ans: "mine" },
                { q: "2. Is there _____ milk in the fridge?", options: ["some", "any", "a"], ans: "any" },
                { q: "3. She has got _____ sweets in her pocket.", options: ["some", "any", "an"], ans: "some" },
                { q: "4. That hat belongs to John. It is _____.", options: ["hers", "his", "mine"], ans: "his" },
                { q: "5. We haven't got _____ orange juice left.", options: ["some", "any", "a"], ans: "any" },
                { q: "6. Is this pencil _____?", options: ["yours", "your", "my"], ans: "yours" },
                { q: "7. There are _____ books on the table.", options: ["some", "any", "an"], ans: "some" },
                { q: "8. The cat belongs to them. It is _____.", options: ["ours", "theirs", "hers"], ans: "theirs" }
            ]
        },
        topic4: {
            title: "4. Modals & Imperatives (Can/Can't, Turn Left)",
            notes: `
                <h2>💡 Grammar Rule: Modals & Imperatives</h2>
                <ul>
                    <li><strong>Can / Can't</strong>: Ability or permission (e.g., "I <em>can</em> swim." / "He <em>can't</em> fly.")</li>
                    <li><strong>Imperatives</strong>: Giving commands/directions (e.g., "<em>Turn left</em>", "<em>Don't touch</em>").</li>
                </ul>
            `,
            questions: [
                { q: "1. Birds _____ fly high in the sky.", options: ["can", "can't", "mustn't"], ans: "can" },
                { q: "2. _____ right at the corner.", options: ["Turn", "Turning", "Turned"], ans: "Turn" },
                { q: "3. Fish _____ live on land.", options: ["can", "can't", "must"], ans: "can't" },
                { q: "4. _____ noisy in the library!", options: ["Don't be", "Not be", "Can't"], ans: "Don't be" },
                { q: "5. _____ you play the piano?", options: ["Can", "Are", "Do"], ans: "Can" },
                { q: "6. _____ the door, please.", options: ["Open", "Opens", "Opening"], ans: "Open" },
                { q: "7. A baby _____ ride a bicycle.", options: ["can", "can't", "is"], ans: "can't" },
                { q: "8. _____ straight ahead.", options: ["Go", "Going", "Gone"], ans: "Go" }
            ]
        },
        topic5: {
            title: "5. Rules & Object Pronouns (Must/Mustn't, Me/Him/Her)",
            notes: `
                <h2>💡 Grammar Rule: Rules & Object Pronouns</h2>
                <ul>
                    <li><strong>Must</strong>: Strong obligation / rule (e.g., "You <em>must</em> listen to the teacher.")</li>
                    <li><strong>Mustn't</strong>: Prohibition (e.g., "You <em>mustn't</em> run in the hall.")</li>
                    <li><strong>Object Pronouns</strong>: <em>me, you, him, her, it, us, them</em>.</li>
                </ul>
            `,
            questions: [
                { q: "1. You _____ eat inside the museum.", options: ["must", "mustn't", "can"], ans: "mustn't" },
                { q: "2. Look at Sarah! Wave to _____.", options: ["him", "her", "them"], ans: "her" },
                { q: "3. Students _____ wear their school uniform.", options: ["must", "mustn't", "can't"], ans: "must" },
                { q: "4. John needs help. Please help _____.", options: ["him", "her", "us"], ans: "him" },
                { q: "5. You _____ throw trash in the bin.", options: ["must", "mustn't", "can't"], ans: "must" },
                { q: "6. We are here! Look at _____!", options: ["them", "us", "him"], ans: "us" },
                { q: "7. You _____ cross the road when the light is red.", options: ["must", "mustn't", "can"], ans: "mustn't" },
                { q: "8. Where are my keys? I can't find _____.", options: ["it", "them", "her"], ans: "them" }
            ]
        },
        topic6: {
            title: "6. Comparatives & Superlatives",
            notes: `
                <h2>💡 Grammar Rule: Comparatives & Superlatives</h2>
                <ul>
                    <li><strong>Comparatives (-er than)</strong>: Comparing 2 things (e.g., "A cheetah is <em>faster than</em> a horse.")</li>
                    <li><strong>Superlatives (the -est / the most)</strong>: Comparing 3+ things (e.g., "The blue whale is <em>the biggest</em> animal.")</li>
                </ul>
            `,
            questions: [
                { q: "1. An elephant is _____ than a cat.", options: ["bigger", "biggest", "the biggest"], ans: "bigger" },
                { q: "2. Mt. Everest is _____ mountain in the world.", options: ["tallest", "the tallest", "taller"], ans: "the tallest" },
                { q: "3. A plane is _____ than a bicycle.", options: ["faster", "fastest", "the fastest"], ans: "faster" },
                { q: "4. Giraffes are the _____ animals.", options: ["taller", "tallest", "tall"], ans: "tallest" },
                { q: "5. Lions are _____ dangerous than rabbits.", options: ["more", "most", "the most"], ans: "more" },
                { q: "6. Cheetahs are _____ animals on land.", options: ["the fastest", "faster", "fast"], ans: "the fastest" },
                { q: "7. Summer is _____ than winter.", options: ["hotter", "hottest", "the hottest"], ans: "hotter" },
                { q: "8. Who is the _____ student in class?", options: ["smartest", "smarter", "more smart"], ans: "smartest" }
            ]
        }
    };

    const tensesData = {
        topic1: {
            title: "1. Simple Present Tense (Routine & Frequency)",
            notes: `
                <h2>💡 Tenses Rule: Simple Present Tense</h2>
                <ul>
                    <li>Used for daily habits, routines, and facts.</li>
                    <li>Add <strong>-s / -es</strong> for <em>He, She, It</em> (e.g., "He <em>plays</em> tennis.")</li>
                    <li>Use <strong>always, sometimes, never</strong> before the verb.</li>
                </ul>
            `,
            questions: [
                { q: "1. She _____ her teeth every morning.", options: ["brush", "brushes", "brushing"], ans: "brushes" },
                { q: "2. They always _____ to school by bus.", options: ["go", "goes", "went"], ans: "go" },
                { q: "3. He sometimes _____ football on Sundays.", options: ["play", "plays", "playing"], ans: "plays" },
                { q: "4. The sun _____ in the east.", options: ["rise", "rises", "rising"], ans: "rises" },
                { q: "5. I never _____ late for school.", options: ["am", "is", "are"], ans: "am" },
                { q: "6. My mother _____ delicious food.", options: ["cook", "cooks", "cooking"], ans: "cooks" },
                { q: "7. We _____ TV after dinner.", options: ["watch", "watches", "watched"], ans: "watch" },
                { q: "8. Does he _____ milk every day?", options: ["drink", "drinks", "drinking"], ans: "drink" }
            ]
        },
        topic2: {
            title: "2. Present Continuous Tense (Right Now)",
            notes: `
                <h2>💡 Tenses Rule: Present Continuous Tense</h2>
                <ul>
                    <li>Used for actions happening <strong>right now</strong>.</li>
                    <li>Formula: <strong>am / is / are + verb-ing</strong></li>
                    <li>Example: "I <em>am reading</em>", "She <em>is cooking</em>", "They <em>are playing</em>".</li>
                </ul>
            `,
            questions: [
                { q: "1. Look! The boys _____ football right now.", options: ["play", "is playing", "are playing"], ans: "are playing" },
                { q: "2. She _____ a story book at the moment.", options: ["is reading", "are reading", "reads"], ans: "is reading" },
                { q: "3. I _____ my English homework now.", options: ["am doing", "is doing", "are doing"], ans: "am doing" },
                { q: "4. Listen! The birds _____ sweetly.", options: ["is singing", "are singing", "sing"], ans: "are singing" },
                { q: "5. What _____ you doing?", options: ["am", "is", "are"], ans: "are" },
                { q: "6. The cat _____ under the tree.", options: ["is sleeping", "are sleeping", "sleep"], ans: "is sleeping" },
                { q: "7. We _____ lunch together right now.", options: ["is eating", "are eating", "eats"], ans: "are eating" },
                { q: "8. He isn't watching TV, he _____.", options: ["is studying", "are studying", "studies"], ans: "is studying" }
            ]
        },
        topic3: {
            title: "3. Simple Past Tense (Was / Were)",
            notes: `
                <h2>💡 Tenses Rule: Was / Were</h2>
                <ul>
                    <li>Used for past state or location (yesterday, last night, last week).</li>
                    <li><strong>WAS</strong>: Used with <em>I, He, She, It</em> (e.g., "I <em>was</em> at home yesterday.")</li>
                    <li><strong>WERE</strong>: Used with <em>You, We, They</em> (e.g., "They <em>were</em> happy.")</li>
                </ul>
            `,
            questions: [
                { q: "1. I _____ at the park yesterday afternoon.", options: ["was", "were", "is"], ans: "was" },
                { q: "2. They _____ at the cinema last night.", options: ["was", "were", "are"], ans: "were" },
                { q: "3. She _____ sick last Monday.", options: ["was", "were", "am"], ans: "was" },
                { q: "4. Where _____ you yesterday?", options: ["was", "were", "are"], ans: "were" },
                { q: "5. The weather _____ sunny two days ago.", options: ["was", "were", "is"], ans: "was" },
                { q: "6. We _____ at the zoo last weekend.", options: ["was", "were", "are"], ans: "were" },
                { q: "7. He _____ not at school yesterday.", options: ["was", "were", "isn't"], ans: "was" },
                { q: "8. The toys _____ in the box yesterday.", options: ["was", "were", "are"], ans: "were" }
            ]
        },
        topic4: {
            title: "4. Simple Past Tense (Regular & Irregular Verbs)",
            notes: `
                <h2>💡 Tenses Rule: Past Action Verbs</h2>
                <ul>
                    <li><strong>Regular Verbs (+ed)</strong>: <em>play ➔ played, walk ➔ walked, listen ➔ listened</em>.</li>
                    <li><strong>Irregular Verbs (Change form)</strong>: <em>go ➔ went, eat ➔ ate, see ➔ saw, buy ➔ bought</em>.</li>
                </ul>
            `,
            questions: [
                { q: "1. We _____ to the beach yesterday.", options: ["go", "went", "going"], ans: "went" },
                { q: "2. She _____ a delicious cake last night.", options: ["bake", "baked", "baking"], ans: "baked" },
                { q: "3. He _____ an apple this morning.", options: ["eat", "ate", "eaten"], ans: "ate" },
                { q: "4. They _____ football last Sunday.", options: ["play", "played", "playing"], ans: "played" },
                { q: "5. I _____ a huge elephant at the zoo.", options: ["see", "saw", "seen"], ans: "saw" },
                { q: "6. My mother _____ a new bag yesterday.", options: ["buy", "bought", "buying"], ans: "bought" },
                { q: "7. You _____ your milk this morning.", options: ["drink", "drank", "drinking"], ans: "drank" },
                { q: "8. He _____ his hands before dinner.", options: ["wash", "washed", "washing"], ans: "washed" }
            ]
        }
    };

    function switchCategory(cat) {
        currentCategory = cat;
        document.getElementById('tab-grammar').classList.toggle('active-tab', cat === 'grammar');
        document.getElementById('tab-tenses').classList.toggle('active-tab', cat === 'tenses');

        const select = document.getElementById('topic-select');
        select.innerHTML = '';

        const activeDataSource = cat === 'grammar' ? grammarData : tensesData;

        Object.keys(activeDataSource).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.innerText = activeDataSource[key].title;
            select.appendChild(opt);
        });

        loadTopicData();
    }

    function loadTopicData() {
        const topicKey = document.getElementById('topic-select').value;
        const dataSource = currentCategory === 'grammar' ? grammarData : tensesData;
        const data = dataSource[topicKey];

        if (!data) return;

        // Render Notes
        document.getElementById('notes-display').innerHTML = data.notes;

        // Render Questions
        let qHtml = '';
        data.questions.forEach((q, idx) => {
            qHtml += `
                <div class="question-card">
                    <p>${q.q}</p>
            `;
            q.options.forEach(opt => {
                qHtml += `
                    <label class="option-label">
                        <input type="radio" name="q_${idx}" value="${opt}">
                        <span>${opt}</span>
                    </label>
                `;
            });
            qHtml += `</div>`;
        });

        document.getElementById('questions-display').innerHTML = qHtml;
        document.getElementById('score-box').style.display = 'none';
    }

    function submitQuiz() {
        const topicKey = document.getElementById('topic-select').value;
        const dataSource = currentCategory === 'grammar' ? grammarData : tensesData;
        const questions = dataSource[topicKey].questions;

        let score = 0;
        let answered = 0;

        questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            if (selected) {
                answered++;
                if (selected.value === q.ans) {
                    score++;
                }
            }
        });

        if (answered < questions.length) {
            if (!confirm(`You answered ${answered} out of ${questions.length} questions. Submit anyway?`)) {
                return;
            }
        }

        const scoreBox = document.getElementById('score-box');
        scoreBox.style.display = 'block';
        scoreBox.innerHTML = `
            <h2 style="color: #be185d; margin: 0 0 10px 0;">🎉 Quiz Complete!</h2>
            <p style="font-size: 26px; font-weight: 700; color: #ec4899; margin: 0;">
                Your Score: ${score} / ${questions.length}
            </p>
        `;
        scoreBox.scrollIntoView({ behavior: 'smooth' });
    }

    // Initialize Page
    window.onload = function() {
        switchCategory('grammar');
    };
</script>

</body>
</html>
